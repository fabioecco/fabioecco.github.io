<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Rogue Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: mesa 5x5 com o bot no topo e você embaixo; painel lateral com a carta escolhida e o registro. */
  :root {
    --bg: #0e1615;
    --panel: #16211f;
    --line: #2a3b38;
    --text: #e9e5d9;
    --muted: #98a7a2;
    --gold: #d6ac3a;
    --me: #4fb0ab;
    --foe: #d0614a;
    --paper: #ece5d2;
    --ink: #1c211f;
    --back: #243541;
    --c-assassino: #a33636;
    --c-ladrao: #8c6a14;
    --c-espiao: #2f6694;
    --c-maniaco: #74449a;
    --c-capanga: #5d625f;
    --font-display: "Cinzel", Georgia, "Times New Roman", serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font: 400 14px/1.45 var(--font-body);
    padding-block: 12px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  h1 { font: 700 22px/1 var(--font-display); letter-spacing: .08em; margin: 0; text-transform: uppercase; }
  header { position: relative; z-index: 55; }
  #lobby .modal { z-index: 80; }
  .spacer { flex: 1; }
  .score { display: flex; gap: 14px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .score b { font-size: 20px; }
  .score .me b { color: var(--me); }
  .score .foe b { color: var(--foe); }
  .score small, .stat small { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .pick { display: grid; gap: 2px; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .pick select { font: inherit; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .btn { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; border-radius: 6px; }
  .btn:hover:not(:disabled) { border-color: var(--gold); }
  .ctrls[hidden] { display: none; }
  .ctrls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .netbadge { color: var(--gold); font-weight: 600; align-self: center; }
  .modal textarea { width: 100%; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: #0b1211; border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; word-break: break-all; }
  .modal p { margin: 0; } .modal .err { color: var(--foe); }
  .modal .actions { grid-auto-flow: column; justify-content: start; }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #1d1a0e; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .status .who { font-weight: 600; }
  .pips { display: inline-flex; gap: 4px; vertical-align: middle; }
  .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gold); }
  .pip.on { background: var(--gold); }

  .layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 330px; } }
  .stack { display: grid; gap: 14px; min-width: 0; align-content: start; }

  .board { max-width: 600px; width: 100%; margin-inline: auto; display: grid; grid-template-columns: 38px repeat(5, minmax(0, 1fr)); gap: 5px; }
  .lab { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; text-align: right; padding-right: 2px; line-height: 1.1; }
  .cell { position: relative; aspect-ratio: 63 / 88; border: 1px solid var(--line); border-radius: 6px; background: #121c1a; padding: 0; display: block; width: 100%; text-align: left; }
  .row-z1 .cell { background: #101918; }
  .row-t .cell { background: #1b1a10; border-color: #4a4120; }
  .chest { position: absolute; inset: 0; display: grid; place-items: center; color: #8f7d38; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .cell.target { outline: 2px solid var(--me); outline-offset: -2px; background: #14302f; }
  .cell.attack { outline: 2px solid var(--foe); outline-offset: -2px; }
  .cell.target::before, .cell.attack::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .08; pointer-events: none; }
  .cell.target { color: var(--me); } .cell.attack { color: var(--foe); }

  .card { position: absolute; inset: 2px; border-radius: 5px; background: var(--paper); color: var(--ink); padding: 4px 5px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; border-top: 4px solid var(--me); }
  .card.foe { border-top-color: var(--foe); }
  .card .nm { font: 600 11px/1.1 var(--font-body); overflow-wrap: anywhere; }
  .card .meta { font-size: 9px; color: #4b524f; line-height: 1.15; }
  .card .badge { align-self: flex-start; font-size: 9px; font-weight: 700; color: #fff; padding: 1px 5px; border-radius: 99px; background: var(--c-capanga); }
  .cls-Assassino .badge { background: var(--c-assassino); } .cls-Ladrão .badge { background: var(--c-ladrao); }
  .cls-Espião .badge { background: var(--c-espiao); } .cls-Maníaco .badge { background: var(--c-maniaco); }
  .tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 2px; }
  .tag { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 4px; border-radius: 3px; background: #2b3532; color: #e9e5d9; }
  .tag.red { background: #8e2e22; } .tag.gold { background: #7a5d10; }
  .card.down { background: var(--back); color: var(--text); background-image: repeating-linear-gradient(45deg, transparent 0 7px, rgba(255,255,255,.05) 7px 8px); }
  .card.down .meta { color: #b3c0ca; }
  .card.hiddenfoe { align-items: center; justify-content: center; font-size: 11px; color: #9fb0bb; }
  .card.exh { opacity: .72; filter: saturate(.6); }

  .card .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 5px; display: block; }
  .card { padding: 0; border-top: 0; box-shadow: 0 0 0 2px var(--me); background: #1d2927; }
  .card.foe { box-shadow: 0 0 0 2px var(--foe); }
  .card .fallback { display: none; }
  .card.noimg { padding: 4px 5px; background: var(--paper); border-top: 4px solid var(--me); box-shadow: none; }
  .card.noimg.foe { border-top-color: var(--foe); }
  .card.noimg.down { background: var(--back); }
  .card.noimg .fallback { display: flex; flex-direction: column; gap: 2px; }
  .card .tags { position: absolute; left: 2px; bottom: 2px; right: 2px; margin: 0; z-index: 2; }
  .card.noimg .tags { position: static; margin-top: auto; }
  .card .fb { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 9px; color: #fff; text-shadow: 0 1px 3px #000; z-index: 2; }
  .card.hiddenfoe.noimg { background: var(--back); }
  .card.noimg .fb { position: static; }
  .cell { overflow: visible; }
  .chest { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; border-radius: 6px; }
  .chest img { position: absolute; inset: 6%; width: 88%; height: 88%; object-fit: contain; opacity: .9; }
  .chest span { position: relative; }
  .chest img + span { display: none; }
  .bigart { width: 100%; max-width: 260px; height: auto; border-radius: 8px; justify-self: center; display: block; }
  .cell.sel { outline: 3px solid var(--gold); outline-offset: -1px; z-index: 1; }

  .hand { display: grid; gap: 8px; }
  .hand h2, .side h2 { margin: 0; font: 600 12px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .handrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .hcard { text-align: left; position: relative; width: 120px; aspect-ratio: 63 / 88; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
  .hcard .card { position: absolute; inset: 0; height: auto; }
  .hcard .txt { font-size: 10px; line-height: 1.25; color: #343b38; }
  .hcard.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
  .empty { color: var(--muted); font-style: italic; }

  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
  .detail h3 { margin: 0 0 2px; font: 700 17px/1.2 var(--font-display); letter-spacing: .03em; }
  .detail .sub { color: var(--muted); font-size: 12px; }
  .detail p { margin: 8px 0; }
  .actions { display: grid; gap: 6px; }
  .why { color: var(--muted); font-size: 11px; margin-top: -2px; }
  .log { max-height: 280px; overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; display: grid; gap: 3px; }
  .log div { color: #c9d1cc; } .log .turn { color: var(--gold); margin-top: 4px; font-weight: 600; }
  .piles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); }
  .piles div { background: #121c1a; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .piles b { color: var(--text); font-weight: 600; }

  .modal { position: fixed; inset: 0; background: rgba(5, 9, 8, .72); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal .box { width: min(480px, 100%); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  .modal h2 { margin: 0; font: 700 18px/1.25 var(--font-display); }
  .opts { display: grid; gap: 6px; }
  .opt { text-align: left; background: #121c1a; border: 1px solid var(--line); padding: 9px 11px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
  .opt:hover { border-color: var(--gold); }
  .opt.picked { border-color: var(--gold); background: #2a2410; }
  .opt .n { min-width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--gold); display: grid; place-items: center; font-size: 11px; color: var(--gold); }
  .opt.picked .n { background: var(--gold); color: #1d1a0e; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #3a1a15; border: 1px solid var(--foe); color: var(--text); padding: 8px 14px; border-radius: 6px; z-index: 60; max-width: calc(100% - 32px); }
  .end h2 { font-size: 26px; }
  .hint { color: var(--muted); font-size: 12px; }


  [hidden] { display: none !important; }
  .wrap2 { display: grid; gap: 14px; }
  .iconbtn { padding: 6px 10px; align-self: center; }
  /* tela inicial */
  .startbox { max-width: 640px; margin: 24px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
  .startbox h2 { margin: 0; font: 700 24px/1.1 var(--font-display); letter-spacing: .04em; }
  .startbox p { margin: 0; }
  .grp { display: grid; gap: 6px; }
  .gl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .tile { text-align: left; display: grid; gap: 3px; padding: 12px; background: #121c1a; border: 2px solid var(--line); border-radius: 8px; }
  .tile b { font: 700 16px var(--font-display); }
  .tile small { color: var(--muted); font-size: 12px; }
  .tile.on { border-color: var(--gold); background: #2a2410; }
  .btn.big { padding: 10px 18px; font-size: 15px; }
  .startbox .actions, .box .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* faixa de escolha / confirmação */
  .promptwrap { position: sticky; top: 0; z-index: 45; }
  .promptwrap:empty { display: none; }
  .prompt { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: #2a2410; border: 2px solid var(--gold); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .prompt.atk { background: #3a1a15; border-color: var(--foe); }
  .prompt .pm { display: grid; gap: 2px; min-width: 0; }
  .prompt .pb { display: flex; flex-wrap: wrap; gap: 8px; }
  /* alvos clicáveis */
  .cell.choose, .hcard.choose { outline: 3px solid var(--gold); outline-offset: -2px; animation: chooseGlow 1.1s ease-in-out infinite alternate; z-index: 1; }
  .cell.picked, .hcard.picked { outline-color: #fff; background: #3a3210; }
  .cell[data-n]::after, .hcard[data-n]::after { content: attr(data-n); position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #1d1a0e; font: 700 12px/20px var(--font-body); text-align: center; z-index: 5; }
  .cell.pending { outline: 3px solid var(--foe); outline-offset: -1px; z-index: 1; }
  .cell.insp, .hcard.insp { outline: 2px dashed var(--muted); outline-offset: -1px; }
  .modal .box.wide { width: min(900px, 100%); }
  @keyframes chooseGlow { from { box-shadow: 0 0 0 0 rgba(214,172,58,.0); } to { box-shadow: 0 0 12px 2px rgba(214,172,58,.55); } }
  /* efeitos sobre a mesa */
  .fx { position: absolute; inset: 0; z-index: 6; pointer-events: none; display: grid; place-content: center; justify-items: center; gap: 2px; border-radius: 6px; opacity: 0; animation: fxLife 2s ease-out forwards; }
  .fx .ic { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 4px #000); }
  .fx .ft { font: 700 11px/1.1 var(--font-body); color: #fff; text-shadow: 0 1px 3px #000; text-align: center; padding: 0 3px; }
  .fx-death { background: rgba(170, 30, 20, .72); }
  .fx-death .ft { text-decoration: line-through; }
  .fx-ret { background: rgba(40, 80, 110, .6); }
  .fx-pulse { outline: 3px solid var(--gold); outline-offset: -2px; background: rgba(214,172,58,.18); animation-name: fxPulse; }
  .fx-icon .ic { font-size: 34px; }
  .fx-coin { background: transparent; }
  .fx-coin .ic { font-size: 40px; animation: coinRise 2.2s ease-out forwards; }
  .fx-coin .ft { font-size: 20px; }
  .fx-coin.mine .ft { color: var(--me); } .fx-coin.foe .ft { color: var(--foe); }
  @keyframes fxLife { 0% { opacity: 0; transform: scale(.6); } 10% { opacity: 1; transform: scale(1.12); } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes fxPulse { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes coinRise { 0% { transform: translateY(8px) scale(.8); } 30% { transform: translateY(-4px) scale(1.2); } 100% { transform: translateY(-16px) scale(1); } }
  .score b.bump { animation: bump .8s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.7); color: var(--gold); } 100% { transform: scale(1); } }
  /* mensagens */
  #feed { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; width: min(320px, calc(100% - 24px)); z-index: 70; pointer-events: none; }
  .feeditem { background: rgba(14, 22, 21, .94); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 6px; padding: 6px 10px; font-size: 13px; animation: feedIn .25s ease-out; }
  .feeditem.bad { border-left-color: var(--foe); } .feeditem.gold { border-left-color: var(--gold); } .feeditem.blue { border-left-color: var(--me); } .feeditem.dim { color: var(--muted); }
  @keyframes feedIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  #announce { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 65; pointer-events: none; font: 700 34px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); text-shadow: 0 2px 12px #000; opacity: 0; white-space: nowrap; }
  #announce.show { animation: announceLife 1.6s ease-out; }
  @keyframes announceLife { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }
  @media (max-width: 520px) { #feed { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); } #announce { font-size: 24px; } .fx .ic { font-size: 22px; } .fx .ft { font-size: 9px; } }
  @media (prefers-reduced-motion: reduce) { .fx, .cell.choose, .hcard.choose, .feeditem, #announce.show, .score b.bump { animation-duration: .01s !important; animation-iteration-count: 1 !important; } .fx { opacity: 1; } }

  @media (max-width: 520px) {
    .board { grid-template-columns: 30px repeat(5, minmax(0, 1fr)); gap: 3px; }
    .card .nm { font-size: 9.5px; } .card .meta { font-size: 8px; } .card.noimg { padding: 3px; }
    .hcard { width: calc(33.333% - 6px); }
  }
  @media (prefers-reduced-motion: no-preference) { .cell, .hcard { transition: outline-color .15s; } }
</style>

<div class="wrap" id="app">
  <header>
    <h1>Rogue Duel</h1>
    <div class="score" id="scorebox" aria-live="polite" hidden>
      <span class="me"><small>Você</small> <b id="sc0">0</b></span>
      <span class="foe"><small id="foe-name">Bot</small> <b id="sc1">0</b></span>
      <small>10 tesouros vencem</small>
    </div>
    <span class="spacer"></span>
    <span id="offline-controls" class="ctrls">
      <button class="btn" id="newgame">Nova partida</button>
      <button class="btn" id="online">Jogar online</button>
    </span>
    <span id="online-controls" class="ctrls" hidden>
      <span class="netbadge" id="netbadge"></span>
      <button class="btn" id="leave">Sair do online</button>
    </span>
    <button class="btn iconbtn" id="snd" aria-label="Som">🔊</button>
  </header>

  <div id="start"></div>

  <div id="gamearea" class="wrap2" hidden>
    <div class="status" id="status"></div>
    <div id="prompt" class="promptwrap"></div>
    <div class="layout">
      <div class="stack">
        <div class="board" id="board" aria-label="Mesa"></div>
        <div class="hand">
          <h2>Sua mão</h2>
          <div class="handrow" id="hand"></div>
        </div>
      </div>
      <aside class="stack">
        <section class="side detail" id="detail" aria-live="polite"></section>
        <section class="side">
          <div class="piles" id="piles"></div>
          <h2>Registro</h2>
          <div class="log" id="log"></div>
          <div class="hint" id="seedinfo"></div>
        </section>
      </aside>
    </div>
  </div>
</div>
<div id="overlay"></div>
<div id="lobby"></div>
<div id="feed" aria-live="polite"></div>
<div id="announce" aria-live="polite"></div>
<div id="toast" class="toast" hidden></div>

<script>(() => {
  // dist/types.js
  var other = (p) => p === 0 ? 1 : 0;

  // dist/game.js
  class GameOver extends Error {
    winner;
    constructor(winner) {
      super("game over");
      this.winner = winner;
    }
  }
  var ROWS = 5;
  var COLS = 5;
  var TREASURE_ROW = 2;
  var WIN_TREASURE = 10;
  var HAND_LIMIT = 6;
  var PA_PER_TURN = 3;
  var z1Row = (p) => p === 0 ? 0 : 4;
  var z2Row = (p) => p === 0 ? 1 : 3;
  var backDir = (p) => p === 0 ? -1 : 1;
  var allowedRows = (p) => [z1Row(p), z2Row(p), TREASURE_ROW];
  function zoneLabel(row, col) {
    const names = ["J1·Z1", "J1·Z2", "Tesouro", "J2·Z2", "J2·Z1"];
    return `${names[row]} c${col + 1}`;
  }
  var hasAbility = (c, cls) => c.def.cls === cls || c.def.abilityOf === cls || c.mods?.ability === cls;
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  var newPlayer = () => ({
    deck: [],
    hand: [],
    graveyard: [],
    extra: [],
    banished: [],
    treasure: 0,
    pa: 0,
    turnsTaken: 0,
    drawnThisTurn: 0
  });

  class Game {
    library;
    cards = new Map;
    players = [newPlayer(), newPlayer()];
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    turn = 0;
    active = 0;
    phase = 0;
    winner = null;
    waiting = null;
    watchers = [];
    logs = [];
    gains = [];
    deaths = [];
    turnCounters = new Map;
    seq = 0;
    batchCounter = 0;
    firstPlayer;
    uidCounter = 1;
    watcherCounter = 1;
    rng;
    co;
    constructor(opts) {
      this.library = opts.library;
      this.rng = (opts.seed ?? Date.now()) >>> 0;
      if (!opts.skipDeckValidation) {
        for (const p of [0, 1]) {
          const errs = Game.validateDeck(opts.decks[p], opts.library);

  const v = cur.view;
  let major = false;
  const snds = new Set();
  const n = Math.min(Math.max(v.logTotal - lastLogTotal, 0), v.log.length);
  const lines = v.log.slice(v.log.length - n).map((l) => l.text);
  lastLogTotal = v.logTotal;

  for (const t of lines) {
    const m = /^── Turno (\d+): J([12]) ──$/.exec(t);
    if (m) {
      const mine = +m[2] - 1 === ME;
      announce(mine ? 'Seu turno' : `Turno d${mode === 'bot' ? 'o bot' : 'o oponente'}`);
      snds.add(mine ? 'turnMine' : 'turnFoe');
      continue;
    }
    if (/compra uma carta|move para|ocupa |é preparada|reorganiza/.test(t)) continue;
    const [icon, cls] = classify(t);
    feed(icon + nm(t), cls);
  }

  if (prev) {
    const pm = boardMap(prev.view), cm = boardMap(v);
    const gyUids = new Set([...v.graveyard[0], ...v.graveyard[1]].map((c) => c.uid));
    const gyName = new Map([...v.graveyard[0], ...v.graveyard[1]].map((c) => [c.uid, c.name]));
    const handUids = new Set(v.hand.map((c) => c.uid));
    for (const [uid, p] of pm) {
      if (cm.has(uid)) continue;
      const name = p.card.hidden ? (gyName.get(uid) || 'Carta virada') : p.card.name;
      if (gyUids.has(uid) || lines.some((t) => t.startsWith(name + ' morre'))) {
        addFx('death', p.r, p.c, '💀', name, 2600); major = true; snds.add('death');
      } else if (handUids.has(uid)) {
        addFx('ret', p.r, p.c, '↩', name, 1800); snds.add('tick');
      } else {
        addFx('ret', p.r, p.c, '💨', name, 1800); snds.add('tick');
      }
    }
    for (const [uid, c] of cm) {
      const p = pm.get(uid);
      if (!p) { addFx('pulse', c.r, c.c, '', '', 1300); snds.add('tick'); continue; }
      if (p.r !== c.r || p.c !== c.c) { addFx('pulse', c.r, c.c, '', '', 1300); snds.add('tick'); }
      if (!c.card.hidden && !p.card.hidden && p.card.faceDown && !c.card.faceDown) { addFx('icon', c.r, c.c, '👁', '', 1800); major = true; snds.add('reveal'); }
      if (!c.card.hidden && !p.card.hidden && !p.card.blocked && c.card.blocked) { addFx('icon', c.r, c.c, '🛡', '', 1800); major = true; snds.add('block'); }
      if (p.card.hidden && !c.card.hidden) { addFx('icon', c.r, c.c, '👁', c.card.name, 2200); major = true; snds.add('reveal'); }
    }
    // tesouros: 💰 sobre a carta que roubou/ganhou (se ela estiver na mesa); senão sobre o baú
    const ng = Math.min(Math.max(v.gainsTotal - lastGainsTotal, 0), v.gains.length);
    const gains = v.gains.slice(v.gains.length - ng);
    for (const gn of gains) {
      const cell = gn.uid !== null && cm.get(gn.uid);
      const [r, c] = cell ? [cell.r, cell.c] : [2, 2];
      addFx('coin ' + (gn.player === ME ? 'mine' : 'foe'), r, c, '💰', `+${gn.n}`, 2400);
      major = true; snds.add(gn.player === ME ? 'coinMine' : 'coinFoe');
      const el = $(gn.player === ME ? 'sc0' : 'sc1'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
  }
  lastGainsTotal = v.gainsTotal;

  if (snds.has('death')) SND.death();
  else if (snds.has('coinMine')) SND.coin(true);
  else if (snds.has('coinFoe')) SND.coin(false);
  else if (snds.has('block')) SND.block();
  else if (snds.has('reveal')) SND.reveal();
  else if (snds.has('tick')) SND.tick();
  if (snds.has('turnMine')) setTimeout(() => SND.turn(true), snds.size > 1 ? 350 : 0);
  else if (snds.has('turnFoe')) setTimeout(() => SND.turn(false), snds.size > 1 ? 350 : 0);
  return { major };
}

function setSnap(ns) {
  prevS = S; S = ns;
  return notify(prevS, ns);
}

function resetUI() {
  clearTimeout(botTimer);
  S = prevS = null; lastLogTotal = 0; lastGainsTotal = 0; fx = []; endSounded = false;
  insp = sel = hover = pending = null; pickedIds = []; lastReqKey = null;
  $('feed').innerHTML = '';
}

// ───────── partida local (bot / anfitrião) ─────────
function startGame(decks) {
  resetUI();
  seed = Math.floor(Math.random() * 900000) + 100000;
  g = new Game({ decks, library: LIBRARY, seed });
  showStart = false;
  pump();
}

function newGame() {
  if (mode === 'guest') { send({ t: 'rematch' }); return; }
  if (mode === 'host') { startGame([DECKS[hostDeck], DECKS[guestDeck]]); return; }
  startGame([DECKS[startDecks.mine], DECKS[startDecks.foe]]);
}

function pump() {
  const r = setSnap(snapshot(g, 0));
  if (mode === 'host') send({ t: 'snap', snap: snapshot(g, 1), seed });
  render();
  if (g.winner !== null || mode !== 'bot' || showStart) return;
  const w = g.waiting;
  if (w && w.player === 1) {
    clearTimeout(botTimer);
    botTimer = setTimeout(() => {
      const r2 = g.submit(1, botInput(g, 1));
      if (!r2.ok) console.error('bot', r2.error);
      pump();
    }, (r.major ? 1800 : 800) * (window.__rdFast ? 0.01 : 1));
  }
}

function submit(input) {
  insp = sel = pending = null;
  if (mode === 'guest') { send({ t: 'input', input }); render(); return true; }
  const r = g.submit(0, input);
  if (!r.ok) { toast(r.error); render(); return false; }
  pump();
  return true;
}

// ───────── rede ─────────
const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };

function send(obj) {
  if (net && net.dc && net.dc.readyState === 'open') net.dc.send(JSON.stringify(obj));
}

function enc(desc) { return 'RD1:' + btoa(JSON.stringify({ type: desc.type, sdp: desc.sdp })); }
function dec(text) {
  const t = String(text).replace(/\s+/g, '');
  if (!t.startsWith('RD1:')) throw new Error('Código inválido.');
  return JSON.parse(atob(t.slice(4)));
}

function gathered(pc) {
  return new Promise((res) => {
    if (pc.iceGatheringState === 'complete') return res();
    const done = () => { pc.removeEventListener('icegatheringstatechange', chk); res(); };
    const chk = () => { if (pc.iceGatheringState === 'complete') done(); };
    pc.addEventListener('icegatheringstatechange', chk);
    setTimeout(done, 3500);
  });
}

function closeNet() {
  if (net) { net.closing = true; try { net.dc && net.dc.close(); } catch (e) {} try { net.pc.close(); } catch (e) {} }
  net = null;
}

function makePeer(role) {
  closeNet();
  const pc = new RTCPeerConnection(ICE);
  net = { pc, dc: null, role, closing: false };
  const mine = net;
  pc.onconnectionstatechange = () => {
    if (mine.closing) return;
    if (['failed', 'closed'].includes(pc.connectionState)) connectionLost();
  };
  return mine;
}

function wireChannel(n, dc) {
  n.dc = dc;
  dc.onopen = () => {
    if (n.role === 'guest') send({ t: 'hello', deck: hostDeckChoice() });
    else if (lobby) { lobby.step = 'connected'; renderLobby(); }
  };
  dc.onclose = () => { if (!n.closing) connectionLost(); };
  dc.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    onNetMessage(m);
  };
}

const hostDeckChoice = () => chosenDeck;

function onNetMessage(m) {
  if (net && net.role === 'host') {
    if (m.t === 'hello' && DECKS[m.deck]) {
      guestDeck = m.deck; hostDeck = hostDeckChoice();
      enterOnline('host');
      newGame();
      lobby = null; renderLobby();
    } else if (m.t === 'input' && g) {
      const r = g.submit(1, m.input);
      if (!r.ok) send({ t: 'err', error: r.error }); else pump();
    } else if (m.t === 'rematch' && g) {
      newGame();
    }
  } else if (net && net.role === 'guest') {
    if (m.t === 'snap') {
      if (mode !== 'guest') enterOnline('guest');
      ME = m.snap.me; FOE = 1 - ME; seed = m.seed;
      if (m.snap.view.turn <= 1 && m.snap.view.logTotal < (S ? S.view.logTotal : 0)) resetUI();
      showStart = false;
      setSnap(m.snap);
      if (lobby) { lobby = null; renderLobby(); }
      render();
    } else if (m.t === 'err') toast(m.error);
  }
}

function enterOnline(role) {
  clearTimeout(botTimer);
  mode = role; g = role === 'host' ? g : null; lost = false;
  ME = role === 'host' ? 0 : 1; FOE = 1 - ME;
  resetUI(); showStart = false;
  $('offline-controls').hidden = true;
  $('online-controls').hidden = false;
  $('netbadge').textContent = `Online · você é o J${ME + 1}`;
  $('foe-name').textContent = 'Oponente';
}

function leaveOnline() {
  closeNet();
  mode = 'bot'; ME = 0; FOE = 1; lost = false; g = null; guestDeck = hostDeck = null;
  $('offline-controls').hidden = false;
  $('online-controls').hidden = true;
  $('foe-name').textContent = 'Bot';
  resetUI(); showStart = true;
  lobby = null; renderLobby();
  render();
}

function connectionLost() {
  if (lost) return;
  lost = true;
  if (!online()) { lobby = { step: 'menu', err: 'A conexão caiu. Tente de novo.' }; renderLobby(); lost = false; return; }
  render();
}

// ───────── lobby ─────────
const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const hasRTC = typeof RTCPeerConnection !== 'undefined';

function copyBtn(id) {
  const ta = $(id);
  const done = () => toast('Código copiado.');
  ta.select();
  const fallback = () => { try { document.execCommand('copy'); done(); } catch (e) { toast('Selecione o código e copie manualmente.'); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
  else fallback();
}

function renderLobby() {
  const o = $('lobby');
  if (!lobby) { o.innerHTML = ''; return; }
  const L = lobby;
  const deckOpts = `<option value="piratas">Ossos Cruzados</option><option value="circo">Show de Horrores</option>`;
  let body = '';
  if (framed || !hasRTC) {
    body = `<p>A conexão entre dois navegadores não funciona dentro desta janela incorporada. Baixe o arquivo <b>RogueDuel.html</b> e abra-o direto no navegador (você e seu amigo, cada um no seu).</p>
      <button class="btn" id="lb-close">Voltar</button>`;
  } else if (L.step === 'menu') {
    body = `${L.err ? `<p class="err">${esc(L.err)}</p>` : ''}
      <label class="pick">Seu baralho<select id="odeck">${deckOpts}</select></label>
      <div class="actions">
        <button class="btn primary" id="lb-host">Criar sala</button>
        <button class="btn" id="lb-join">Entrar em uma sala</button>
        <button class="btn" id="lb-close">Voltar</button>
      </div>
      <p class="hint">Sem servidor e sem conta: vocês dois trocam um código de texto (por WhatsApp, por exemplo). Quem cria a sala roda a partida.</p>`;
  } else if (L.step === 'working') {
    body = `<p>Preparando conexão…</p>`;
  } else if (L.step === 'hostCode') {
    body = `<p><b>1.</b> Envie este código ao seu amigo:</p>
      <textarea id="mycode" readonly rows="5">${esc(L.code)}</textarea>
      <button class="btn" id="lb-copy">Copiar código</button>
      <p><b>2.</b> Cole aqui a resposta que ele devolver:</p>
      <textarea id="theircode" rows="5" placeholder="RD1:…"></textarea>
      ${L.err ? `<p class="err">${esc(L.err)}</p>` : ''}
      <div class="actions"><button class="btn primary" id="lb-connect">Conectar</button><button class="btn" id="lb-cancel">Cancelar</button></div>`;
  } else if (L.step === 'guestPaste') {
    body = `<p><b>1.</b> Cole aqui o código que o anfitrião enviou:</p>
      <textarea id="theircode" rows="5" placeholder="RD1:…"></textarea>
      <label class="pick">Seu baralho<select id="odeck">${deckOpts}</select></label>
      ${L.err ? `<p class="err">${esc(L.err)}</p>` : ''}
      <div class="actions"><button class="btn primary" id="lb-answer">Gerar resposta</button><button class="btn" id="lb-cancel">Cancelar</button></div>`;
  } else if (L.step === 'guestCode') {
    body = `<p><b>2.</b> Devolva este código ao anfitrião:</p>
      <textarea id="mycode" readonly rows="5">${esc(L.code)}</textarea>
      <button class="btn" id="lb-copy">Copiar código</button>
      <p class="hint">Assim que ele colar o código e conectar, a partida começa sozinha.</p>
      <button class="btn" id="lb-cancel">Cancelar</button>`;
  } else if (L.step === 'connecting' || L.step === 'connected') {
    body = `<p>${L.step === 'connected' ? 'Conectado! Iniciando a partida…' : 'Conectando…'}</p>
      <button class="btn" id="lb-cancel">Cancelar</button>`;
  }
  o.innerHTML = `<div class="modal"><div class="box"><h2>Jogar online</h2>${body}</div></div>`;
  if ($('odeck')) $('odeck').value = chosenDeck;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('lb-close', () => { lobby = null; renderLobby(); });
  on('lb-cancel', () => { closeNet(); lobby = { step: 'menu' }; renderLobby(); });
  on('lb-copy', () => copyBtn('mycode'));
  on('lb-host', hostStart);
  on('lb-join', () => { chosenDeck = $('odeck').value; lobby = { step: 'guestPaste' }; renderLobby(); });
  on('lb-connect', hostConnect);
  on('lb-answer', guestAnswer);
}

async function hostStart() {
  chosenDeck = $('odeck').value;
  lobby = { step: 'working' }; renderLobby();
  try {
    const n = makePeer('host');
    wireChannel(n, n.pc.createDataChannel('rd'));
    await n.pc.setLocalDescription(await n.pc.createOffer());
    await gathered(n.pc);
    lobby = { step: 'hostCode', code: enc(n.pc.localDescription) }; renderLobby();
  } catch (e) { closeNet(); lobby = { step: 'menu', err: 'Não consegui criar a sala: ' + e.message }; renderLobby(); }
}

async function hostConnect() {
  const txt = $('theircode').value;
  try {
    await net.pc.setRemoteDescription(dec(txt));
    const code = lobby.code;
    lobby = { step: 'connecting', code }; renderLobby();
  } catch (e) {
    lobby.err = 'Código inválido. Confira se colou a resposta inteira.';
    const keep = txt; renderLobby(); $('theircode').value = keep;
  }
}

async function guestAnswer() {
  const txt = $('theircode').value; chosenDeck = $('odeck').value;
  let offer;
  try { offer = dec(txt); } catch (e) { lobby.err = 'Código inválido. Confira se colou o código inteiro.'; renderLobby(); $('theircode').value = txt; return; }
  lobby = { step: 'working' }; renderLobby();
  try {
    const n = makePeer('guest');
    n.pc.ondatachannel = (ev) => wireChannel(n, ev.channel);
    await n.pc.setRemoteDescription(offer);
    await n.pc.setLocalDescription(await n.pc.createAnswer());
    await gathered(n.pc);
    lobby = { step: 'guestCode', code: enc(n.pc.localDescription) }; renderLobby();
  } catch (e) { closeNet(); lobby = { step: 'guestPaste', err: 'Não consegui usar esse código: ' + e.message }; renderLobby(); }
}


// ───────── desenho ─────────
const DISPLAY_ROWS = () => (ME === 0 ? [4, 3, 2, 1, 0] : [0, 1, 2, 3, 4]);
const rowOwner = (r) => (r < 2 ? 0 : r > 2 ? 1 : null);
const rowLabel = (r) => {
  if (r === 2) return 'Tesouro';
  const z = r === 0 || r === 4 ? 'Z1' : 'Z2';
  return rowOwner(r) === ME ? `Sua ${z}` : `${z} do ${mode === 'bot' ? 'bot' : 'oponente'}`;
};
const myZ1 = () => (ME === 0 ? 0 : 4);

function cardMaps(v) {
  const m = new Map();
  v.board.forEach((row) => row.forEach((c) => c && m.set(c.uid, c)));
  v.hand.forEach((c) => m.set(c.uid, c));
  return m;
}

function cardHTML(c, opts = {}) {
  const back = `<img class="art" src="${IMG_BACK}" alt="" draggable="false" onerror="this.parentNode.classList.add('noimg')">`;
  if (c.hidden) return `<div class="card foe down hiddenfoe">${back}<span class="fb">virada</span></div>`;
  const cls = ['card', c.owner === ME ? '' : 'foe', 'cls-' + c.cls, c.faceDown ? 'down' : '', c.exhausted ? 'exh' : ''].join(' ');
  const type = c.type ? `(${esc(c.type)})` : '';
  const tags = [];
  if (c.faceDown) tags.push('<span class="tag">virada</span>');
  if (c.blocked) tags.push('<span class="tag red">bloqueada</span>');
  else if (c.exhausted) tags.push('<span class="tag">exausta</span>');
  if (c.contActive) tags.push('<span class="tag gold">contínua</span>');
  const src = c.faceDown ? IMG_BACK : cardImg(c.defId, c.img);
  const speed = c.speed ? ` · ${esc(c.speed)}` : '';
  return `<div class="${cls}${src ? '' : ' noimg'}">
    ${src ? `<img class="art" src="${src}" alt="${esc(c.faceDown ? 'carta virada' : c.name)}" draggable="false" loading="lazy" onerror="this.parentNode.classList.add('noimg')">` : ''}
    <div class="fallback">
      <span class="badge">${esc(c.cls)}</span>
      <span class="nm">${esc(c.name)}</span>
      <span class="meta">${type}${speed}</span>
      ${opts.full ? `<span class="txt">${esc(c.text)}</span>` : ''}
    </div>
    <span class="tags">${tags.join('')}</span></div>`;
}

/** Descreve como a escolha pendente deve ser feita: clicando na mesa, na mão, numa grade de cartas ou em botões. */
function choiceInfo(w, v) {
  const onBoard = new Map();
  v.board.forEach((row, r) => row.forEach((c, col) => c && onBoard.set(c.uid, [r, col])));
  const inHand = new Set(v.hand.map((c) => c.uid));
  const isT = (o) => o.card !== undefined || !!o.pos;
  const tg = w.options.filter(isT), rest = w.options.filter((o) => !isT(o));
  const cellOf = (o) => (o.pos ? [o.pos.row, o.pos.col] : onBoard.get(o.card));
  if (tg.length && tg.every((o) => cellOf(o))) return { kind: 'board', tg, rest, cellOf };
  if (tg.length && tg.every((o) => o.card !== undefined && inHand.has(o.card))) return { kind: 'hand', tg, rest };
  if (w.options.some((o) => o.def)) return { kind: 'grid', tg: w.options.filter((o) => o.def), rest: w.options.filter((o) => !o.def) };
  return { kind: 'plain', tg: [], rest: w.options };
}

const selectable = (c) => !!c && !c.hidden && c.owner === ME;

function render() {
  $('start').hidden = !showStart;
  $('gamearea').hidden = showStart || !S;
  $('scorebox').hidden = showStart || !S;
  if (showStart) { renderStart(); $('overlay').innerHTML = ''; $('prompt').innerHTML = ''; return; }
  if (!S) return;
  const v = S.view;
  curMaps = cardMaps(v);
  const req = v.request;
  const mine = !!req && req.kind === 'action' && v.winner === null;
  const legal = mine ? S.legal : [];
  const ch = req && req.kind === 'choice' && v.winner === null ? choiceInfo(req, v) : null;
  if (ch && lastReqKey !== JSON.stringify(req)) { lastReqKey = JSON.stringify(req); pickedIds = []; }
  if (!ch) lastReqKey = null;
  if (insp !== null && !curMaps.has(insp)) insp = null;
  if (sel !== null && !curMaps.has(sel)) sel = null;
  if (!mine) { sel = null; pending = null; }

  // destinos da carta selecionada
  const dest = new Map();
  if (mine && sel !== null) {
    for (const a of legal) {
      if (a.t === 'move' && a.card === sel) dest.set(`${a.row},${a.col}`, { a, attack: !!v.board[a.row][a.col] });
      if (a.t === 'play' && a.card === sel) dest.set(`${myZ1()},${a.col}`, { a, attack: false });
    }
  }
  // alvos da escolha pendente
  const pick = new Map(); // "r,c" ou "h<uid>" -> opção
  if (ch && ch.kind === 'board') ch.tg.forEach((o) => { const [r, c] = ch.cellOf(o); pick.set(`${r},${c}`, o); });
  if (ch && ch.kind === 'hand') ch.tg.forEach((o) => pick.set('h' + o.card, o));

  $('sc0').textContent = v.treasure[ME];
  $('sc1').textContent = v.treasure[FOE];
  const phaseNames = { 0: 'Preparação', 1: 'Compra', 2: 'Preparação', 3: 'Assalto', 4: 'Final' };
  const pips = (n) => `<span class="pips" aria-label="${n} PA">${[0, 1, 2].map((i) => `<span class="pip ${i < n ? 'on' : ''}"></span>`).join('')}</span>`;
  let who;
  if (v.winner !== null) who = 'Fim de partida';
  else if (req) who = req.kind === 'choice' ? 'Sua escolha' : 'Sua vez';
  else who = mode === 'bot' ? 'Bot jogando…' : 'Oponente jogando…';
  $('status').innerHTML = `<span class="who">${who}</span>
    <span>Turno ${v.turn} · Fase ${v.phase || '-'} ${esc(phaseNames[v.phase])}</span>
    <span>PA ${pips(v.pa[ME])}</span>
    <span class="spacer" style="flex:1"></span>
    <button class="btn primary" id="endturn" ${mine ? '' : 'disabled'}>Encerrar turno</button>`;
  $('endturn').onclick = () => { submit({ t: 'endTurn' }); };

  // mesa
  const now = performance.now();
  fx = fx.filter((f) => f.t0 + f.dur > now);
  let html = '';
  for (const r of DISPLAY_ROWS()) {
    const cls = r === 2 ? 'row-t' : (r === 0 || r === 4) ? 'row-z1' : 'row-z2';
    html += `<div class="lab">${esc(rowLabel(r))}</div>`;
    for (let c = 0; c < 5; c++) {
      const cv = v.board[r][c];
      const d = dest.get(`${r},${c}`);
      const po = pick.get(`${r},${c}`);
      const pi = po ? pickedIds.indexOf(po.id) : -1;
      const pendHere = pending && pending.row === r && pending.col === c;
      const classes = ['cell', cls, d ? (d.attack ? 'attack' : 'target') : '', po ? 'choose' : '', pi >= 0 ? 'picked' : '',
        pendHere ? 'pending' : '', cv && cv.uid === sel ? 'sel' : '', cv && cv.uid === insp && cv.uid !== sel ? 'insp' : '', cv ? '' : 'blank'].join(' ');
      const label = cv ? (cv.hidden ? 'carta virada do oponente' : cv.name) : 'posição vazia';
      const fxs = fx.filter((f) => f.row === r && f.col === c).map((f) => {
        const off = Math.round(now - f.t0);
        return `<span class="fx fx-${f.kind}" style="animation-duration:${f.dur}ms;animation-delay:-${off}ms"><span class="ic">${f.icon}</span>${f.text ? `<span class="ft">${esc(f.text)}</span>` : ''}</span>`;
      }).join('');
      html += `<button class="${classes}" data-r="${r}" data-c="${c}" ${cv ? `data-u="${cv.uid}"` : ''} ${pi >= 0 ? `data-n="${pi + 1}"` : ''} aria-label="${esc(rowLabel(r))} coluna ${c + 1}: ${esc(label)}">${cv ? cardHTML(cv) : (r === 2 ? `<span class="chest"><img src="${IMG_CHEST}" alt="" draggable="false" onerror="this.remove()"><span>baú</span></span>` : '')}${fxs}</button>`;
    }
  }
  $('board').innerHTML = html;
  $('board').querySelectorAll('.cell').forEach((el) => {
    el.onclick = () => onCell(+el.dataset.r, +el.dataset.c, dest, pick, ch, v);
    if (canHover && el.dataset.u) {
      el.onmouseenter = () => { hover = +el.dataset.u; renderDetail(); };
      el.onmouseleave = () => { hover = null; renderDetail(); };
    }
  });

  // mão
  $('hand').innerHTML = v.hand.length
    ? v.hand.map((c) => {
      const po = pick.get('h' + c.uid), pi = po ? pickedIds.indexOf(po.id) : -1;
      return `<button class="hcard ${c.uid === sel ? 'sel' : ''} ${c.uid === insp && c.uid !== sel ? 'insp' : ''} ${po ? 'choose' : ''} ${pi >= 0 ? 'picked' : ''}" data-u="${c.uid}" ${pi >= 0 ? `data-n="${pi + 1}"` : ''}>${cardHTML(c, { full: true })}</button>`;
    }).join('')
    : '<span class="empty">Sem cartas na mão.</span>';
  $('hand').querySelectorAll('.hcard').forEach((el) => {
    const u = +el.dataset.u;
    el.onclick = () => onHand(u, pick, ch);
    if (canHover) {
      el.onmouseenter = () => { hover = u; renderDetail(); };
      el.onmouseleave = () => { hover = null; renderDetail(); };
    }
  });

  renderDetail();
  renderPrompt(v, ch, dest);

  const gy = (p) => v.graveyard[p].map((c) => esc(c.name)).join(', ') || '—';
  $('piles').innerHTML = `
    <div><small>Você</small><br>Baralho <b>${v.deckCount[ME]}</b> · Extra <b>${v.extraCount[ME]}</b><br>Cemitério: <b>${gy(ME)}</b></div>
    <div><small>${oppName()}</small><br>Baralho <b>${v.deckCount[FOE]}</b> · Extra <b>${v.extraCount[FOE]}</b> · Mão <b>${v.oppHandCount}</b><br>Cemitério: <b>${gy(FOE)}</b></div>`;

  const logEl = $('log');
  const stick = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
  logEl.innerHTML = v.log.map((l) => `<div class="${l.text.startsWith('──') ? 'turn' : ''}">${esc(nm(l.text))}</div>`).join('');
  if (stick) logEl.scrollTop = logEl.scrollHeight;
  $('seedinfo').textContent = `Partida nº ${seed}${mode === 'bot' ? ' (informe este número se achar um erro).' : '.'}`;

  renderOverlay(v, ch);
}

// ───────── cliques ─────────
function chooseIds(ids) { lastReqKey = null; pickedIds = []; submit({ t: 'choose', ids }); }

function togglePick(opt, w) {
  if (w.min === 1 && w.max === 1 && !w.ordered) { chooseIds([opt.id]); return; }
  const i = pickedIds.indexOf(opt.id);
  if (i >= 0) pickedIds.splice(i, 1); else if (pickedIds.length < w.max) pickedIds.push(opt.id);
  render();
}

function onCell(r, c, dest, pick, ch, v) {
  const po = pick.get(`${r},${c}`);
  if (po) { togglePick(po, v.request); return; }
  const d = dest.get(`${r},${c}`);
  if (d) {
    if (d.attack) {
      const t = v.board[r][c], att = curMaps.get(sel);
      pending = { a: d.a, row: r, col: c, target: t.hidden ? 'a carta virada' : t.name, attacker: att ? att.name : 'sua carta' };
      render();
    } else submit(d.a);
    return;
  }
  pending = null;
  const cv = v.board[r][c];
  clickCard(cv);
}

function onHand(u, pick, ch) {
  const po = pick.get('h' + u);
  if (po) { togglePick(po, S.view.request); return; }
  pending = null;
  clickCard(curMaps.get(u));
}

/** 1º clique inspeciona; 2º clique na mesma carta (se for sua e for a sua vez) seleciona. */
function clickCard(c) {
  if (!c) { insp = sel = null; render(); return; }
  const mine = !!S.view.request && S.view.request.kind === 'action' && S.view.winner === null;
  if (c.uid === insp && selectable(c) && mine) sel = sel === c.uid ? null : c.uid;
  else { insp = c.uid; sel = null; }
  render();
}

// ───────── painéis ─────────
function renderDetail() {
  if (!S) return;
  const v = S.view;
  const el = $('detail');
  const uid = hover !== null ? hover : (sel !== null ? sel : insp);
  const preview = hover !== null && hover !== sel && hover !== insp;
  if (uid === null) {
    el.innerHTML = `<h3>Escolha uma carta</h3><p class="hint">${canHover ? 'Passe o mouse sobre uma carta para lê-la.' : 'Toque numa carta para lê-la.'} Para agir com uma carta sua, clique nela de novo: ela fica selecionada e as posições possíveis são destacadas.</p>`;
    return;
  }
  const c = curMaps.get(uid);
  if (!c) { el.innerHTML = ''; return; }
  if (c.hidden) { el.innerHTML = `<h3>Carta virada do oponente</h3><p class="hint">Só se revela quando virar pra cima.</p>`; return; }
  const inHand = v.hand.some((h) => h.uid === uid);
  const mineTurn = !!v.request && v.request.kind === 'action' && v.winner === null;
  const typeTxt = c.type ? ` (${esc(c.type)})` : '';
  let extra = '';
  if (!preview && selectable(c) && mineTurn) {
    if (uid === sel) extra = inHand
      ? `<p class="hint">${c.type === 'Maldição' ? 'Maldição só sai da mão por descarte.' : 'Clique numa coluna destacada da sua Z1 para jogar (1 PA).'}</p>`
      : '<div class="actions" id="acts"></div>';
    else extra = '<p class="hint">Clique de novo nesta carta para selecioná-la.</p>';
  }
  const big = cardImg(c.defId, c.img);
  el.innerHTML = `${big ? `<img class="bigart" src="${big}" alt="${esc(c.name)}" onerror="this.remove()">` : ''}<h3>${esc(c.name)}</h3>
    <div class="sub">${esc(c.cls)}${typeTxt}${c.speed ? ' · ' + esc(c.speed) : ''}${c.owner === FOE ? ' · do ' + (mode === 'bot' ? 'bot' : 'oponente') : ''}</div>
    <p>${esc(c.text)}</p>${extra}`;
  const box = el.querySelector('#acts');
  if (box) (S.acts[uid] || []).forEach((a) => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = a.label; b.disabled = !!a.err;
    b.onclick = () => submit(a.action);
    box.appendChild(b);
    if (a.err) { const w = document.createElement('div'); w.className = 'why'; w.textContent = a.err; box.appendChild(w); }
  });
}

/** Faixa fixa no topo da mesa: escolhas por clique, confirmação de ataque. */
function renderPrompt(v, ch, dest) {
  const p = $('prompt');
  if (pending) {
    p.innerHTML = `<div class="prompt atk"><div class="pm"><b>Atacar ${esc(pending.target)} com ${esc(pending.attacker)}?</b><span class="hint">A carta atacada morre se o ataque for bem-sucedido.</span></div>
      <div class="pb"><button class="btn primary" id="pk-yes">Atacar</button><button class="btn" id="pk-no">Cancelar</button></div></div>`;
    $('pk-yes').onclick = () => submit(pending.a);
    $('pk-no').onclick = () => { pending = null; render(); };
    return;
  }
  if (!ch || ch.kind === 'grid') { p.innerHTML = ''; return; }
  const w = v.request;
  const multi = !(w.min === 1 && w.max === 1 && !w.ordered);
  const hint = ch.kind === 'board' ? 'Clique na carta ou posição destacada na mesa.'
    : ch.kind === 'hand' ? 'Clique numa carta destacada da sua mão.' : '';
  const sub = multi ? ` Escolha de ${w.min} a ${w.max}${w.ordered ? ', na ordem desejada' : ''}.` : '';
  p.innerHTML = `<div class="prompt"><div class="pm"><b>${esc(nm(w.message))}</b>${hint || sub ? `<span class="hint">${hint}${sub}</span>` : ''}</div>
    <div class="pb">${ch.rest.map((o) => `<button class="btn ${o.id === 'yes' ? 'primary' : ''}" data-id="${esc(o.id)}">${esc(nm(o.label))}</button>`).join('')}
    ${multi && ch.tg.length ? `<button class="btn primary" id="pk-ok" ${pickedIds.length >= w.min && pickedIds.length <= w.max ? '' : 'disabled'}>Confirmar</button>` : ''}</div></div>`;
  p.querySelectorAll('[data-id]').forEach((b) => { b.onclick = () => chooseIds([b.dataset.id]); });
  const ok = $('pk-ok'); if (ok) ok.onclick = () => chooseIds(pickedIds.slice());
}

function defCard(defId) {
  const d = LIBRARY[defId].def;
  return { uid: -1, defId, img: d.img, name: d.name, cls: d.cls, type: d.type, speed: d.speed, text: d.text, owner: ME, faceDown: false, exhausted: false, blocked: false, contActive: false, hidden: false };
}

function renderOverlay(v, ch) {
  const o = $('overlay');
  if (lost) {
    o.innerHTML = `<div class="modal"><div class="box end"><h2>Conexão perdida</h2>
      <div>A conexão com o outro jogador caiu. Esta partida não pode ser retomada.</div>
      <button class="btn primary" id="leave2">Voltar ao menu inicial</button></div></div>`;
    $('leave2').onclick = leaveOnline;
    return;
  }
  if (v.winner !== null) {
    const t = v.winner === 'draw' ? 'Empate' : v.winner === ME ? 'Você venceu!' : `${oppName() === 'Bot' ? 'O bot' : 'O oponente'} venceu`;
    if (!endSounded) { endSounded = true; (v.winner === ME ? SND.win : SND.lose)(); }
    o.innerHTML = `<div class="modal"><div class="box end"><h2>${t}</h2>
      <div>Tesouros: você ${v.treasure[ME]} × ${v.treasure[FOE]} ${oppName().toLowerCase()}.</div>
      <div class="actions"><button class="btn primary" id="again">Jogar de novo</button>
      ${mode === 'bot' ? '<button class="btn" id="menu">Trocar baralhos</button>' : ''}</div></div></div>`;
    $('again').onclick = () => { o.innerHTML = ''; newGame(); };
    const mb = $('menu'); if (mb) mb.onclick = () => { showStart = true; render(); };
    return;
  }
  if (ch && ch.kind === 'grid') {
    const w = v.request;
    const multi = !(w.min === 1 && w.max === 1 && !w.ordered);
    o.innerHTML = `<div class="modal"><div class="box wide"><h2>${esc(nm(w.message))}</h2>
      ${multi ? `<div class="hint">Escolha de ${w.min} a ${w.max}${w.ordered ? ', na ordem desejada' : ''}.</div>` : ''}
      <div class="handrow">${ch.tg.map((op) => {
        const i = pickedIds.indexOf(op.id);
        return `<button class="hcard choose ${i >= 0 ? 'picked' : ''}" data-id="${esc(op.id)}" ${i >= 0 ? `data-n="${i + 1}"` : ''}>${cardHTML(defCard(op.def), { full: true })}</button>`;
      }).join('')}</div>
      ${ch.rest.length ? `<div class="actions">${ch.rest.map((r) => `<button class="btn" data-rest="${esc(r.id)}">${esc(nm(r.label))}</button>`).join('')}</div>` : ''}
      ${multi ? `<button class="btn primary" id="confirm" ${pickedIds.length >= w.min && pickedIds.length <= w.max ? '' : 'disabled'}>Confirmar</button>` : ''}
    </div></div>`;
    o.querySelectorAll('[data-id]').forEach((b) => { b.onclick = () => togglePick(w.options.find((x) => x.id === b.dataset.id), w); });
    o.querySelectorAll('[data-rest]').forEach((b) => { b.onclick = () => { o.innerHTML = ''; chooseIds([b.dataset.rest]); }; });
    const cf = $('confirm'); if (cf) cf.onclick = () => { const ids = pickedIds.slice(); o.innerHTML = ''; chooseIds(ids); };
    return;
  }
  o.innerHTML = '';
}

// ───────── tela inicial ─────────
function renderStart() {
  const tile = (grp, id, label, sub) => `<button class="tile ${startDecks[grp] === id ? 'on' : ''}" data-g="${grp}" data-d="${id}" aria-pressed="${startDecks[grp] === id}"><b>${label}</b><small>${sub}</small></button>`;
  const info = { piratas: '15 cartas + Capangas Pirata e Partes do Mapa', circo: '15 cartas + Capangas Sapo e Canção Sinistra' };
  $('start').innerHTML = `<div class="startbox">
    <h2>Nova partida</h2>
    <p class="hint">Escolha os baralhos. O primeiro jogador é sorteado ao iniciar e, se você não tiver Espião na mão, poderá fazer mulligan.</p>
    <div class="grp"><span class="gl">Seu baralho</span><div class="tiles">${['piratas', 'circo'].map((d) => tile('mine', d, DECK_NAMES[d], info[d])).join('')}</div></div>
    <div class="grp"><span class="gl">Baralho do bot</span><div class="tiles">${['piratas', 'circo'].map((d) => tile('foe', d, DECK_NAMES[d], info[d])).join('')}</div></div>
    <div class="actions"><button class="btn primary big" id="go">Iniciar partida</button>
      <button class="btn" id="goonline">Jogar online com um amigo</button>
      ${S && S.view.winner === null && mode === 'bot' ? '<button class="btn" id="back">Voltar à partida</button>' : ''}</div>
  </div>`;
  $('start').querySelectorAll('.tile').forEach((b) => { b.onclick = () => { startDecks[b.dataset.g] = b.dataset.d; renderStart(); }; });
  $('go').onclick = () => { if (mode !== 'bot') leaveOnline(); startGame([DECKS[startDecks.mine], DECKS[startDecks.foe]]); };
  $('goonline').onclick = () => { lobby = { step: 'menu' }; renderLobby(); };
  const bk = $('back'); if (bk) bk.onclick = () => { showStart = false; pump(); };
}

// ───────── inicialização ─────────
$('newgame').onclick = () => { clearTimeout(botTimer); showStart = true; render(); };
$('online').onclick = () => { lobby = { step: 'menu' }; renderLobby(); };
$('leave').onclick = leaveOnline;
$('snd').onclick = () => setSound(!soundOn);
$('snd').textContent = soundOn ? '🔊' : '🔇';
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (sel !== null || insp !== null || pending)) { sel = insp = null; pending = null; render(); }
});
render();
window.__rd = { get mode() { return mode; }, get S() { return S; }, get g() { return g; }, get sel() { return sel; }, get insp() { return insp; }, get fx() { return fx; } };

})();</script>
</body></html>
