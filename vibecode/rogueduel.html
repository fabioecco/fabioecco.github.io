<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Rogue Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: mesa 5x5 com o bot no topo e você embaixo; painel lateral com a carta escolhida e o registro. */
  :root {
    --bg: #0b0b0b;
    --panel: #1b1b1b;
    --line: #353535;
    --text: #f2f2f2;
    --muted: #a0a0a0;
    --gold: #ff4d4d;
    --me: #f2f2f2;
    --foe: #ff6e5f;
    --paper: #eeeeee;
    --ink: #1a1a1a;
    --back: #2b2b2b;
    --c-assassino: #a33636;
    --c-ladrao: #8c6a14;
    --c-espiao: #2f6694;
    --c-maniaco: #74449a;
    --c-capanga: #666666;
    --font-display: "Cinzel", Georgia, "Times New Roman", serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font: 400 14px/1.45 var(--font-body);
    padding-block: 12px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  h1 { font: 700 22px/1 var(--font-display); letter-spacing: .08em; margin: 0; text-transform: uppercase; }
  header { position: relative; z-index: 55; }
  #lobby .modal { z-index: 80; }
  .spacer { flex: 1; }
  .score { display: flex; gap: 14px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .score b { font-size: 20px; }
  .score .me b { color: var(--me); }
  .score .foe b { color: var(--foe); }
  .score small, .stat small { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .pick { display: grid; gap: 2px; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .pick select { font: inherit; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .btn { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; border-radius: 6px; }
  .btn:hover:not(:disabled) { border-color: var(--gold); }
  .ctrls[hidden] { display: none; }
  .ctrls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .netbadge { color: var(--gold); font-weight: 600; align-self: center; }
  .modal textarea { width: 100%; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: #0a0a0a; border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; word-break: break-all; }
  .modal p { margin: 0; } .modal .err { color: var(--foe); }
  .modal .actions { grid-auto-flow: column; justify-content: start; }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #ffffff; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .status .who { font-weight: 600; }
  .pips { display: inline-flex; gap: 4px; vertical-align: middle; }
  .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gold); }
  .pip.on { background: var(--gold); }
  .pips .dots { display: inline-flex; gap: 4px; }
  .pipn { margin-left: 2px; color: var(--gold); font-size: .95em; }
  @media (max-width: 480px) { .pip { width: 10px; height: 10px; } .pips, .pips .dots { gap: 3px; } .pips .dots.two { display: grid; grid-template-columns: repeat(5, 10px); gap: 3px; } }

  .layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 330px; } }
  .stack { display: grid; gap: 14px; min-width: 0; align-content: start; }

  .board { max-width: 600px; width: 100%; margin-inline: auto; display: grid; grid-template-columns: 38px repeat(5, minmax(0, 1fr)); gap: 5px; }
  .lab { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; text-align: right; padding-right: 2px; line-height: 1.1; }
  .cell { position: relative; aspect-ratio: 63 / 88; border: 1px solid var(--line); border-radius: 6px; background: #141414; padding: 0; display: block; width: 100%; text-align: left; }
  .row-z1 .cell { background: #111111; }
  .row-t .cell { background: #1f1515; border-color: #5a2b2b; }
  .chest { position: absolute; inset: 0; display: grid; place-items: center; color: #a86a6a; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .cell.target { outline: 2px solid var(--me); outline-offset: -2px; background: #2b2b2b; }
  .cell.attack { outline: 2px solid var(--foe); outline-offset: -2px; }
  .cell.target::before, .cell.attack::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .08; pointer-events: none; }
  .cell.target { color: var(--me); } .cell.attack { color: var(--foe); }

  .card { position: absolute; inset: 2px; border-radius: 5px; background: var(--paper); color: var(--ink); padding: 4px 5px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; border-top: 4px solid var(--me); }
  .card.foe { border-top-color: var(--foe); }
  .card .nm { font: 600 11px/1.1 var(--font-body); overflow-wrap: anywhere; }
  .card .meta { font-size: 9px; color: #555555; line-height: 1.15; }
  .card .badge { align-self: flex-start; font-size: 9px; font-weight: 700; color: #fff; padding: 1px 5px; border-radius: 99px; background: var(--c-capanga); }
  .cls-Assassino .badge { background: var(--c-assassino); } .cls-Ladrão .badge { background: var(--c-ladrao); }
  .cls-Espião .badge { background: var(--c-espiao); } .cls-Maníaco .badge { background: var(--c-maniaco); }
  .tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 2px; }
  .tag { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 4px; border-radius: 3px; background: #2c2c2c; color: #f2f2f2; }
  .tag.red { background: #8e2e22; } .tag.gold { background: #7d0c0f; }
  .card.down { background: var(--back); color: var(--text); background-image: repeating-linear-gradient(45deg, transparent 0 7px, rgba(255,255,255,.05) 7px 8px); }
  .card.down .meta { color: #c4c4c4; }
  .card.hiddenfoe { align-items: center; justify-content: center; font-size: 11px; color: #c4c4c4; }
  .card.exh { opacity: .72; filter: saturate(.6); }

  .card .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 5px; display: block; }
  .card { padding: 0; border-top: 0; box-shadow: 0 0 0 2px var(--me); background: #222222; }
  .card.foe { box-shadow: 0 0 0 2px var(--foe); }
  .card .fallback { display: none; }
  .card.noimg { padding: 4px 5px; background: var(--paper); border-top: 4px solid var(--me); box-shadow: none; }
  .card.noimg.foe { border-top-color: var(--foe); }
  .card.noimg.down { background: var(--back); }
  .card.noimg .fallback { display: flex; flex-direction: column; gap: 2px; }
  .card .tags { position: absolute; left: 2px; bottom: 2px; right: 2px; margin: 0; z-index: 2; }
  .card.noimg .tags { position: static; margin-top: auto; }
  .card .fb { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 9px; color: #fff; text-shadow: 0 1px 3px #000; z-index: 2; }
  .card.hiddenfoe.noimg { background: var(--back); }
  .card.noimg .fb { position: static; }
  .cell { overflow: visible; }
  .chest { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; border-radius: 6px; }
  .chest img { position: absolute; inset: 6%; width: 88%; height: 88%; object-fit: contain; opacity: .9; }
  .chest span { position: relative; }
  .chest img + span { display: none; }
  .bigart { width: 100%; max-width: 260px; height: auto; border-radius: 8px; justify-self: center; display: block; }
  .cell.sel { outline: 3px solid var(--gold); outline-offset: -1px; z-index: 1; }

  .hand { display: grid; gap: 8px; }
  .hand h2, .side h2 { margin: 0; font: 600 12px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .handrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .hcard { text-align: left; position: relative; width: 120px; aspect-ratio: 63 / 88; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
  .hcard .card { position: absolute; inset: 0; height: auto; }
  .hcard .txt { font-size: 10px; line-height: 1.25; color: #3a3a3a; }
  .hcard.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
  .empty { color: var(--muted); font-style: italic; }

  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
  .detail h3 { margin: 0 0 2px; font: 700 17px/1.2 var(--font-display); letter-spacing: .03em; }
  .detail .sub { color: var(--muted); font-size: 12px; }
  .detail p { margin: 8px 0; }
  .bigart { cursor: zoom-in; }
  #zoom .modal { cursor: zoom-out; }
  #zoom img { max-height: 86vh; max-width: min(92vw, 520px); border-radius: 12px; }
  .actions { display: grid; gap: 6px; }
  .why { color: var(--muted); font-size: 11px; margin-top: -2px; }
  .log { max-height: 280px; overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; display: grid; gap: 3px; }
  .log div { color: #d2d2d2; } .log .turn { color: var(--gold); margin-top: 4px; font-weight: 600; }
  .piles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); }
  .piles div { background: #141414; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .piles b { color: var(--text); font-weight: 600; }

  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .72); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal .box { width: min(480px, 100%); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  .modal h2 { margin: 0; font: 700 18px/1.25 var(--font-display); }
  .opts { display: grid; gap: 6px; }
  .opt { text-align: left; background: #141414; border: 1px solid var(--line); padding: 9px 11px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
  .opt:hover { border-color: var(--gold); }
  .opt.picked { border-color: var(--gold); background: #2f0c0e; }
  .opt .n { min-width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--gold); display: grid; place-items: center; font-size: 11px; color: var(--gold); }
  .opt.picked .n { background: var(--gold); color: #ffffff; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #3a1311; border: 1px solid var(--foe); color: var(--text); padding: 8px 14px; border-radius: 6px; z-index: 60; max-width: calc(100% - 32px); }
  .end h2 { font-size: 26px; }
  .hint { color: var(--muted); font-size: 12px; }


  [hidden] { display: none !important; }
  .wrap > *, .wrap2 > *, .layout > *, .stack > * { min-width: 0; }
  .wrap2 { display: grid; gap: 14px; }
  .status .short { display: none; }
  .iconbtn { padding: 6px 10px; align-self: center; }
  /* tela inicial */
  .startbox { max-width: 640px; margin: 24px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
  .startbox h2 { margin: 0; font: 700 24px/1.1 var(--font-display); letter-spacing: .04em; }
  .startbox p { margin: 0; }
  .grp { display: grid; gap: 6px; }
  .gl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .tile { text-align: left; display: grid; gap: 3px; padding: 12px; background: #141414; border: 2px solid var(--line); border-radius: 8px; }
  .tile b { font: 700 16px var(--font-display); }
  .tile small { color: var(--muted); font-size: 12px; }
  .imp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .errbox { background: #3a1311; border: 1px solid #8a2d28; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .errbox ul { margin: 4px 0 0; padding-left: 18px; }
  .tile.on { border-color: var(--gold); background: #2f0c0e; }
  .btn.big { padding: 10px 18px; font-size: 15px; }
  .startbox .actions, .box .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* faixa de escolha / confirmação */
  .promptwrap { height: 64px; }
  .prompt { height: 100%; display: flex; gap: 10px 14px; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; overflow: hidden; }
  .prompt.idle { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; justify-content: flex-start; }
  .prompt.decide { background: #2f0c0e; border: 2px solid var(--gold); }
  .prompt.atk { background: #3a1311; border: 2px solid var(--foe); }
  .prompt .pm { display: grid; gap: 1px; min-width: 0; flex: 1 1 auto; }
  .prompt .pm b { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
  .prompt .pm .hint { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .prompt .pb { display: flex; gap: 8px; flex: 0 0 auto; max-width: 100%; overflow-x: auto; }
  .prompt .pb .btn, .prompt .btn { white-space: nowrap; }
  .prompt .btn.off { opacity: .45; }
  .prompt .sel-name { font: 700 15px var(--font-display); letter-spacing: .03em; white-space: nowrap; margin-right: 4px; }
  .prompt.act { justify-content: flex-start; }
  .prompt.act .pb { overflow-x: auto; }
  /* alvos clicáveis */
  .cell.choose, .hcard.choose { outline: 3px solid var(--gold); outline-offset: -2px; animation: chooseGlow 1.1s ease-in-out infinite alternate; z-index: 1; }
  .cell.picked, .hcard.picked { outline-color: #fff; background: #3d1214; }
  .cell[data-n]::after, .hcard[data-n]::after { content: attr(data-n); position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #ffffff; font: 700 12px/20px var(--font-body); text-align: center; z-index: 5; }
  .cell.pending { outline: 3px solid var(--foe); outline-offset: -1px; z-index: 1; }
  .cell.insp, .hcard.insp { outline: 2px dashed var(--muted); outline-offset: -1px; }
  .modal .box.wide { width: min(900px, 100%); }
  @keyframes chooseGlow { from { box-shadow: 0 0 0 0 rgba(255,77,77,.0); } to { box-shadow: 0 0 12px 2px rgba(255,77,77,.55); } }
  /* efeitos sobre a mesa */
  .fx { position: absolute; inset: 0; z-index: 6; pointer-events: none; display: grid; place-content: center; justify-items: center; gap: 2px; border-radius: 6px; opacity: 0; animation: fxLife 2s ease-out forwards; }
  .fx .ic { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 4px #000); }
  .fx .ft { font: 700 11px/1.1 var(--font-body); color: #fff; text-shadow: 0 1px 3px #000; text-align: center; padding: 0 3px; }
  .fx-death { background: rgba(170, 30, 20, .72); }
  .fx-death .ft { text-decoration: line-through; }
  .fx-ret { background: rgba(95, 95, 95, .6); }
  .fx-pulse { outline: 3px solid var(--gold); outline-offset: -2px; background: rgba(255,77,77,.18); animation-name: fxPulse; }
  .fx-icon .ic { font-size: 34px; }
  .fx-coin { background: transparent; }
  .fx-coin .ic { font-size: 40px; animation: coinRise 2.2s ease-out forwards; }
  .fx-coin .ft { font-size: 20px; }
  .fx-coin.mine .ft { color: var(--me); } .fx-coin.foe .ft { color: var(--foe); }
  @keyframes fxLife { 0% { opacity: 0; transform: scale(.6); } 10% { opacity: 1; transform: scale(1.12); } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes fxPulse { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes coinRise { 0% { transform: translateY(8px) scale(.8); } 30% { transform: translateY(-4px) scale(1.2); } 100% { transform: translateY(-16px) scale(1); } }
  .score b.bump { animation: bump .8s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.7); color: var(--gold); } 100% { transform: scale(1); } }
  /* mensagens */
  #feed { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; width: min(320px, calc(100% - 24px)); z-index: 70; pointer-events: none; }
  .feeditem { background: rgba(12, 12, 12, .94); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 6px; padding: 6px 10px; font-size: 13px; animation: feedIn .25s ease-out; }
  .feeditem.bad { border-left-color: var(--foe); } .feeditem.gold { border-left-color: var(--gold); } .feeditem.blue { border-left-color: var(--me); } .feeditem.dim { color: var(--muted); }
  @keyframes feedIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  #announce { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 65; pointer-events: none; font: 700 34px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); text-shadow: 0 2px 12px #000; opacity: 0; white-space: nowrap; }
  #announce.show { animation: announceLife 1.6s ease-out; }
  @keyframes announceLife { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }
  @media (max-width: 520px) { #announce { font-size: 24px; } .fx .ic { font-size: 22px; } .fx .ft { font-size: 9px; } }
  @media (prefers-reduced-motion: reduce) { .fx, .cell.choose, .hcard.choose, .feeditem, #announce.show, .score b.bump { animation-duration: .01s !important; animation-iteration-count: 1 !important; } .fx { opacity: 1; } }


  /* telas estreitas: informação da carta numa faixa fixa no rodapé; mão em uma linha */
  @media (max-width: 959px) {
    .wrap { padding-bottom: 124px; }
    .detail { position: fixed; left: 0; right: 0; bottom: 0; z-index: 48; margin: 0; height: 108px; border-radius: 12px 12px 0 0; border-width: 1px 0 0; display: flex; align-items: stretch; gap: 10px; padding: 8px max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-shadow: 0 -8px 20px rgba(0,0,0,.55); overflow: hidden; }
    .detail .bigart { width: auto; height: 100%; max-width: none; flex: none; aspect-ratio: 63 / 88; object-fit: cover; }
    .detail .dtext { min-width: 0; overflow-y: auto; font-size: 13px; }
    .detail h3 { font-size: 15px; }
    .detail p { margin: 4px 0; }
    .toast { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
    #feed { top: auto; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (max-width: 520px) {
    .wrap { gap: 8px; padding-bottom: 100px; }
    .wrap2 { gap: 8px; }
    .layout, .stack { gap: 8px; }
    header { gap: 6px 10px; }
    h1 { display: none; }
    .status .long { display: none; } .status .short { display: inline; }
    .status { flex-wrap: nowrap; } .status .who { white-space: nowrap; } .status .btn .long { display: none; }
    .prompt .pb .hint { display: none; }
    .score { gap: 8px; font-size: 12px; } .score b { font-size: 16px; } .score > small:last-child { display: none; }
    .ctrls { gap: 6px; }
    header .btn { padding: 5px 7px; font-size: 12px; }
    header { flex-wrap: nowrap; } header .spacer { flex: 1 1 0; min-width: 0; } .score small { font-size: 10px; }
    .status { padding: 5px 8px; gap: 4px 10px; font-size: 13px; }
    .status .btn { padding: 5px 9px; }
    .promptwrap { height: 56px; }
    .board { max-width: none; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .lab { display: none; }
    .card .nm { font-size: 8.5px; } .card .meta { font-size: 7px; } .card.noimg { padding: 2px; }
    .hand { gap: 4px; } .hand h2 { display: none; }
    .handrow { flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
    .hcard { flex: 0 0 calc((100% - 20px) / 6); width: calc((100% - 20px) / 6); min-width: 48px; }
    .hcard .card .fallback .txt { display: none; }
    .prompt { padding: 4px 8px; gap: 6px; font-size: 13px; } .prompt .btn { padding: 6px 9px; font-size: 13px; }
    .detail { height: 88px !important; }
    .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; }

<script>(() => {
  // dist/types.js
  var other = (p) => p === 0 ? 1 : 0;

  // dist/game.js
  class GameOver extends Error {
    winner;
    constructor(winner) {
      super("game over");
      this.winner = winner;
    }
  }
  var ROWS = 5;
  var COLS = 5;
  var TREASURE_ROW = 2;
  var WIN_TREASURE = 10;
  var HAND_LIMIT = 6;
  var PA_PER_TURN = 3;
  var z1Row = (p) => p === 0 ? 0 : 4;
  var z2Row = (p) => p === 0 ? 1 : 3;
  var backDir = (p) => p === 0 ? -1 : 1;
  var allowedRows = (p) => [z1Row(p), z2Row(p), TREASURE_ROW];
  function zoneLabel(row, col) {
    const names = ["J1·Z1", "J1·Z2", "Tesouro", "J2·Z2", "J2·Z1"];
    return `${names[row]} c${col + 1}`;
  }
  var hasAbility = (c, cls) => c.def.cls === cls || c.def.abilityOf === cls || c.mods?.ability === cls;
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  var newPlayer = () => ({
    deck: [],
    hand: [],
    graveyard: [],
    extra: [],
    banished: [],
    treasure: 0,
    pa: 0,
    turnsTaken: 0,
    drawnThisTurn: 0
  });

  class Game {
    library;
    cards = new Map;
    players = [newPlayer(), newPlayer()];
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    turn = 0;
    active = 0;
    phase = 0;
    winner = null;
    puppet = null;
    ctl(c) {
      return c.puppeteer ?? c.owner;
    }
    waiting = null;
    watchers = [];
    logs = [];
    gains = [];
    deaths = [];
    lastPower = null;
    redirects = [];
    locks = [];
    destroyed = Array.from({ length: COLS }, () => false);
    turnCounters = new Map;
    seq = 0;
    batchCounter = 0;
    firstPlayer;
    uidCounter = 1;
    watcherCounter = 1;
    rng;
    co;
    constructor(opts) {
      this.library = opts.library;
      this.rng = (opts.seed ?? Date.now()) >>> 0;
      if (!opts.skipDeckValidation) {
        for (const p of [0, 1]) {
          const errs = Game.validateDeck(opts.decks[p], opts.library);
          if (errs.length)
            throw new Error(`Baralho do jogador ${p + 1} inválido: ${errs.join("; ")}`);
        }
      }
      for (const p of [0, 1]) {
        for (const id of opts.decks[p]) {
          const c = this.newCard(p, id);
          this.place(c, { z: "deck", p });
        }
      }
      this.firstPlayer = opts.firstPlayer ?? (this.random() < 0.5 ? 0 : 1);
      this.co = this.main();
      this.step(undefined);
    }
    static validateDeck(ids, library) {
      const errs = [];
      if (ids.length !== 15)
        errs.push(`precisa ter exatamente 15 cartas (tem ${ids.length})`);
      const seen = new Set;
      for (const id of ids) {
        const e = library[id];
        if (!e)
          errs.push(`carta desconhecida: ${id}`);
        else if (e.def.cls === "Capanga")
          errs.push(`Capanga não vai no baralho: ${e.def.name}`);
        if (seen.has(id))
          errs.push(`cópia repetida: ${id}`);
        seen.add(id);
      }
      return errs;
    }
    random() {
      this.rng = this.rng + 1831565813 >>> 0;
      let t = this.rng;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    shuffle(arr) {
      for (let i = arr.length - 1;i > 0; i--) {
        const j = Math.floor(this.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    card(uid) {
      const c = this.cards.get(uid);
      if (!c)
        throw new Error(`carta inexistente: ${uid}`);
      return c;
    }
    logPush(text) {
      this.logs.push({ turn: this.turn, text });
    }
    pos(c) {
      return c.loc && c.loc.z === "board" ? { row: c.loc.row, col: c.loc.col } : null;
    }
    onBoard(c) {
      return !!c.loc && c.loc.z === "board";
    }
    cardAt(row, col) {
      const u = this.board[row]?.[col];
      return u == null ? null : this.card(u);
    }
    boardCards(filter) {
      const out = [];
      for (let r = 0;r < ROWS; r++)
        for (let c = 0;c < COLS; c++) {
          const u = this.board[r][c];
          if (u != null) {
            const ci = this.card(u);
            if (!filter || filter(ci))
              out.push(ci);
          }
        }
      return out;
    }
    cardsInZone(p, z) {
      return this.players[p][z].map((u) => this.card(u));
    }
    cardLabel(c) {
      const p = this.pos(c);
      return p ? `${c.def.name} (${zoneLabel(p.row, p.col)})` : c.def.name;
    }
    createPositions(p) {
      const out = [];
      for (let r = 0;r < ROWS; r++) {
        if (r === z1Row(other(p)))
          continue;
        for (let c = 0;c < COLS; c++)
          if (this.board[r][c] == null)
            out.push({ row: r, col: c });
      }
      return out;
    }
    typesOf(c) {
      if (c.loc?.z === "board") {
        for (const w of this.boardCards()) {
          if (w === c || w.faceDown)
            continue;
          const impl = w.imitating ?? (w.contActive ? this.library[w.def.id]?.power : undefined);
          if (impl?.suppressTypes?.(this, w, c))
            return [];
        }
      }
      const out = [];
      if (c.def.type)
        out.push(c.def.type);
      for (const gr of c.mods?.types ?? []) {
        if (gr.until !== undefined && gr.until < this.turn)
          continue;
        if (gr.cont && !c.contActive && !c.imitating)
          continue;
        if (!out.includes(gr.t))
          out.push(gr.t);
      }
      return out;
    }
    hasType(c, t) {
      return this.typesOf(c).includes(t);
    }
    grantType(c, gr) {
      c.mods = { ...c.mods ?? {}, types: [...c.mods?.types ?? [], gr] };
    }
    canBan(c) {
      const impl = c.imitating ?? (c.contActive ? this.library[c.def.id]?.power : undefined);
      return !impl?.noBan;
    }
    canKill(source, target) {
      if (this.hasType(target, "Invulnerável") && !(source && this.hasType(source, "Exterminador")))
        return false;
      if (this.hasType(target, "Obstáculo") && !(source && this.hasType(source, "Fortão")))
        return false;
      return true;
    }
    newCard(owner, defId) {
      const entry = this.library[defId];
      if (!entry)
        throw new Error(`carta desconhecida: ${defId}`);
      const c = {
        uid: this.uidCounter++,
        def: entry.def,
        owner,
        loc: null,
        faceDown: false,
        exhausted: false,
        blocked: false,
        contActive: false,
        stoleThisTurn: false,
        movedThisTurn: false,
        noPrepare: false,
        home: null,
        zoneSeq: 0,
        mods: null,
        imitating: null
      };
      this.cards.set(c.uid, c);
      return c;
    }
    debugSpawn(owner, defId, dest, flags = {}) {
      const c = this.newCard(owner, defId);
      c.home = dest.z;
      this.place(c, dest);
      Object.assign(c, flags);
      return c;
    }
    place(c, dest, opts = {}) {
      let d = dest;
      if (c.puppeteer !== undefined && d.z !== "board")
        c.puppeteer = undefined;
      if (c.def.cls === "Capanga" && c.home && d.z !== "extra" && d.z !== c.home && !c.def.alsoIn?.includes(d.z)) {
        d = { z: "extra", p: c.creator ?? c.owner };
      }
      if (d.z === "extra" && c.creator !== undefined) {
        c.owner = c.creator;
        c.creator = undefined;
        d = { z: "extra", p: c.owner };
      }
      const old = c.loc;
      if (old) {
        if (old.z === "board")
          this.board[old.row][old.col] = null;
        else {
          const arr = this.players[old.p][old.z];
          const i = arr.indexOf(c.uid);
          if (i >= 0)
            arr.splice(i, 1);
        }
      }
      if (d.z === "board") {
        if (this.board[d.row][d.col] != null)
          throw new Error("posição ocupada");
        this.board[d.row][d.col] = c.uid;
      } else {
        const arr = this.players[d.p][d.z];
        if (opts.top)
          arr.unshift(c.uid);
        else
          arr.push(c.uid);
      }
      c.loc = d;
      c.zoneSeq = ++this.seq;
      if (old && old.z === "board" && d.z === "board")
        c.movedThisTurn = true;
      if (!(old && old.z === "board" && d.z === "board")) {
        c.faceDown = false;
        c.exhausted = false;
        c.blocked = false;
        c.noPrepare = false;
        c.mods = null;
        this.revertCopy(c);
        this.cancelPowersOf(c);
      }
    }
    createCapanga(owner, defId, dest, opts = {}) {
      const P = this.players[owner];
      let inst = P.extra.map((u) => this.card(u)).find((x) => x.def.id === defId);
      if (!inst)
        inst = this.newCard(owner, defId);
      inst.home = dest.z;
      this.place(inst, dest);
      inst.faceDown = !!opts.faceDown && dest.z === "board";
      if (opts.mods)
        inst.mods = opts.mods;
      const key = `${owner}:${defId}`;
      this.turnCounters.set(key, (this.turnCounters.get(key) ?? 0) + 1);
      const counted = dest.z === "hand" && dest.p !== owner ? ` (${this.players[dest.p].hand.filter((u) => this.card(u).def.id === inst.def.id).length})` : "";
      this.logPush(inst.faceDown ? `J${owner + 1} cria um Capanga virado pra baixo.` : `J${owner + 1} cria "${inst.def.name}"${counted}.`);
      return inst;
    }
    revertCopy(c) {
      if (c.origDef) {
        c.def = c.origDef;
        c.origDef = undefined;
      }
    }
    cancelPowersOf(c) {
      this.watchers = this.watchers.filter((w) => w.source !== c.uid);
      c.contActive = false;
      c.imitating = null;
    }
    newBatch() {
      return ++this.batchCounter;
    }
    createdThisTurn(owner, defId) {
      return this.turnCounters.get(`${owner}:${defId}`) ?? 0;
    }
    prepareCard(c) {
      if (this.isLocked("prepare", c.owner)) {
        this.logPush(`${c.def.name} não pode ser preparada.`);
        return;
      }
      c.exhausted = false;
      c.blocked = false;
      this.cancelPowersOf(c);
    }
    addWatcher(w) {
      const full = { ...w, source: w.source.uid, id: this.watcherCounter++, seq: ++this.seq };
      this.watchers.push(full);
      return full;
    }
    addLock(source, kind, player, mode, turnOf) {
      const w = this.addWatcher({
        source,
        owner: source.owner,
        kind: mode,
        event: "turnEnd",
        expireTurn: mode === "lenta" ? this.turn + 1 : undefined,
        cond: () => false,
        *run() {}
      });
      this.locks.push({ w, kind, player, turnOf });
    }
    isLocked(kind, player) {
      this.locks = this.locks.filter((l) => this.watchers.includes(l.w));
      return this.locks.some((l) => l.kind === kind && (l.player === "both" || l.player === player) && (l.turnOf === undefined || this.active === l.turnOf));
    }
    loseTreasure(p, n) {
      if (n <= 0 || this.isLocked("treasure", p))
        return false;
      this.players[p].treasure = Math.max(0, this.players[p].treasure - n);
      this.logPush(`J${p + 1} perde ${n} tesouro(s) (total ${this.players[p].treasure}).`);
      return true;
    }
    canStealHere(c) {
      const p = this.pos(c);
      return !!p && p.row === TREASURE_ROW && !this.destroyed[p.col];
    }
    *choose(player, message, options, min = 1, max = 1, ordered = false, real = false) {
      if (options.length === 0)
        return [];
      if (!real && this.puppet && this.puppet.puppeteer !== undefined && player === this.puppet.owner)
        player = this.puppet.puppeteer;
      min = Math.min(min, options.length);
      max = Math.min(max, options.length);
      const input = yield { kind: "choice", player, message, options, min, max, ordered };
      return input.ids;
    }
    *chooseCard(player, message, cards) {
      if (cards.length === 0)
        return null;
      if (cards.length === 1)
        return cards[0];
      const [id] = yield* this.choose(player, message, cards.map((c) => ({ id: String(c.uid), label: this.cardLabel(c), card: c.uid, def: c.def.id })));
      return this.card(Number(id));
    }
    *chooseYesNo(player, message) {
      const [a] = yield* this.choose(player, message, [
        { id: "yes", label: "Sim" },
        { id: "no", label: "Não" }
      ], 1, 1, false, true);
      return a === "yes";
    }
    *emit(name, data = {}) {
      const entries = [];
      for (const w of this.watchers) {
        if (w.event !== name)
          continue;
        entries.push({
          seq: w.seq,
          active: () => this.watchers.includes(w) && (!w.cond || w.cond(this, data)),
          run: () => w.run(this, data)
        });
      }
      for (const c of this.cards.values()) {
        const trigs = this.library[c.def.id]?.triggers;
        if (!trigs)
          continue;
        for (const t of trigs) {
          if (t.event !== name)
            continue;
          entries.push({
            seq: c.zoneSeq,
            active: () => !!c.loc && t.zones.includes(c.loc.z) && (c.loc.z !== "board" || !c.faceDown) && (!t.cond || t.cond(this, c, data)),
            run: () => t.run(this, c, data)
          });
        }
      }
      entries.sort((a, b) => a.seq - b.seq);
      const savedPuppet = this.puppet;
      this.puppet = null;
      try {
        for (const e of entries) {
          if (e.active())
            yield* e.run();
        }
      } finally {
        this.puppet = savedPuppet;
      }
    }
    *drawCard(p, count = true) {
      const P = this.players[p];
      const uid = P.deck.shift();
      if (uid === undefined)
        return null;
      const c = this.card(uid);
      this.place(c, { z: "hand", p });
      if (count)
        P.drawnThisTurn++;
      this.logPush(`J${p + 1} compra uma carta.`);
      if (count)
        yield* this.emit("draw", { player: p, card: c });
      if (c.loc?.z === "hand")
        yield* this.emit("enterHand", { player: p, card: c });
      return c;
    }
    *drawFromGraveyard(c) {
      const p = c.owner;

    body = `<p>Preparando conexão…</p>`;
  } else if (L.step === 'hostCode') {
    body = `<p><b>1.</b> Envie este código ao seu amigo:</p>
      <textarea id="mycode" readonly rows="5">${esc(L.code)}</textarea>
      <button class="btn" id="lb-copy">Copiar código</button>
      <p><b>2.</b> Cole aqui a resposta que ele devolver:</p>
      <textarea id="theircode" rows="5" placeholder="RD1:…"></textarea>
      ${L.err ? `<p class="err">${esc(L.err)}</p>` : ''}
      <div class="actions"><button class="btn primary" id="lb-connect">Conectar</button><button class="btn" id="lb-cancel">Cancelar</button></div>`;
  } else if (L.step === 'guestPaste') {
    body = `<p><b>1.</b> Cole aqui o código que o anfitrião enviou:</p>
      <textarea id="theircode" rows="5" placeholder="RD1:…"></textarea>
      <label class="pick">Seu baralho<select id="odeck">${deckOpts}</select></label>
      ${L.err ? `<p class="err">${esc(L.err)}</p>` : ''}
      <div class="actions"><button class="btn primary" id="lb-answer">Gerar resposta</button><button class="btn" id="lb-cancel">Cancelar</button></div>`;
  } else if (L.step === 'guestCode') {
    body = `<p><b>2.</b> Devolva este código ao anfitrião:</p>
      <textarea id="mycode" readonly rows="5">${esc(L.code)}</textarea>
      <button class="btn" id="lb-copy">Copiar código</button>
      <p class="hint">Assim que ele colar o código e conectar, a partida começa sozinha.</p>
      <button class="btn" id="lb-cancel">Cancelar</button>`;
  } else if (L.step === 'connecting' || L.step === 'connected') {
    body = `<p>${L.step === 'connected' ? 'Conectado! Iniciando a partida…' : 'Conectando…'}</p>
      <button class="btn" id="lb-cancel">Cancelar</button>`;
  }
  o.innerHTML = `<div class="modal"><div class="box"><h2>Jogar online</h2>${body}</div></div>`;
  if ($('odeck')) $('odeck').value = chosenDeck;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('lb-close', () => { lobby = null; renderLobby(); });
  on('lb-cancel', () => { closeNet(); lobby = { step: 'menu' }; renderLobby(); });
  on('lb-copy', () => copyBtn('mycode'));
  on('lb-host', hostStart);
  on('lb-join', () => { chosenDeck = $('odeck').value; lobby = { step: 'guestPaste' }; renderLobby(); });
  on('lb-connect', hostConnect);
  on('lb-answer', guestAnswer);
}

async function hostStart() {
  chosenDeck = $('odeck').value;
  lobby = { step: 'working' }; renderLobby();
  try {
    const n = makePeer('host');
    wireChannel(n, n.pc.createDataChannel('rd'));
    await n.pc.setLocalDescription(await n.pc.createOffer());
    await gathered(n.pc);
    lobby = { step: 'hostCode', code: enc(n.pc.localDescription) }; renderLobby();
  } catch (e) { closeNet(); lobby = { step: 'menu', err: 'Não consegui criar a sala: ' + e.message }; renderLobby(); }
}

async function hostConnect() {
  const txt = $('theircode').value;
  try {
    await net.pc.setRemoteDescription(dec(txt));
    const code = lobby.code;
    lobby = { step: 'connecting', code }; renderLobby();
  } catch (e) {
    lobby.err = 'Código inválido. Confira se colou a resposta inteira.';
    const keep = txt; renderLobby(); $('theircode').value = keep;
  }
}

async function guestAnswer() {
  const txt = $('theircode').value; chosenDeck = $('odeck').value;
  let offer;
  try { offer = dec(txt); } catch (e) { lobby.err = 'Código inválido. Confira se colou o código inteiro.'; renderLobby(); $('theircode').value = txt; return; }
  lobby = { step: 'working' }; renderLobby();
  try {
    const n = makePeer('guest');
    n.pc.ondatachannel = (ev) => wireChannel(n, ev.channel);
    await n.pc.setRemoteDescription(offer);
    await n.pc.setLocalDescription(await n.pc.createAnswer());
    await gathered(n.pc);
    lobby = { step: 'guestCode', code: enc(n.pc.localDescription) }; renderLobby();
  } catch (e) { closeNet(); lobby = { step: 'guestPaste', err: 'Não consegui usar esse código: ' + e.message }; renderLobby(); }
}


// ───────── desenho ─────────
const DISPLAY_ROWS = () => (ME === 0 ? [4, 3, 2, 1, 0] : [0, 1, 2, 3, 4]);
const rowOwner = (r) => (r < 2 ? 0 : r > 2 ? 1 : null);
const rowLabel = (r) => {
  if (r === 2) return 'Tesouro';
  const z = r === 0 || r === 4 ? 'Z1' : 'Z2';
  return rowOwner(r) === ME ? `Sua ${z}` : `${z} do ${mode === 'bot' ? 'bot' : 'oponente'}`;
};
const myZ1 = () => (ME === 0 ? 0 : 4);

function cardMaps(v) {
  const m = new Map();
  v.board.forEach((row) => row.forEach((c) => c && m.set(c.uid, c)));
  v.hand.forEach((c) => m.set(c.uid, c));
  return m;
}

function cardHTML(c, opts = {}) {
  const backSrc = (c.hidden ? c.capanga : c.cls === 'Capanga') ? IMG_BACK_CAPANGA : IMG_BACK;
  const back = `<img class="art" src="${backSrc}" alt="" draggable="false" onerror="this.parentNode.classList.add('noimg')">`;
  if (c.hidden) return `<div class="card foe down hiddenfoe">${back}<span class="fb">virada</span></div>`;
  const cls = ['card', c.owner === ME ? '' : 'foe', c.puppet !== undefined ? 'puppet' : '', 'cls-' + c.cls, c.faceDown ? 'down' : '', c.exhausted ? 'exh' : ''].join(' ');
  const type = c.type ? `(${esc(c.type)})` : '';
  const tags = [];
  if (c.faceDown) tags.push('<span class="tag">virada</span>');
  if (c.blocked) tags.push('<span class="tag red">bloqueada</span>');
  else if (c.exhausted) tags.push('<span class="tag">exausta</span>');
  if (c.contActive) tags.push('<span class="tag gold">contínua</span>');
  const src = c.faceDown ? backSrc : cardImg(c.defId, c.img);
  const speed = c.speed ? ` · ${esc(c.speed)}` : '';
  return `<div class="${cls}${src ? '' : ' noimg'}">
    ${src ? `<img class="art" src="${src}" alt="${esc(c.faceDown ? 'carta virada' : c.name)}" draggable="false" loading="lazy" onerror="this.parentNode.classList.add('noimg')">` : ''}
    <div class="fallback">
      <span class="badge">${esc(c.cls)}</span>
      <span class="nm">${esc(c.name)}</span>
      <span class="meta">${type}${speed}</span>
      ${opts.full ? `<span class="txt">${esc(c.text)}</span>` : ''}
    </div>
    <span class="tags">${tags.join('')}</span></div>`;
}

/** Descreve como a escolha pendente deve ser feita: clicando na mesa, na mão, numa grade de cartas ou em botões. */
function choiceInfo(w, v) {
  const onBoard = new Map();
  v.board.forEach((row, r) => row.forEach((c, col) => c && onBoard.set(c.uid, [r, col])));
  const inHand = new Set(v.hand.map((c) => c.uid));
  const isT = (o) => o.card !== undefined || !!o.pos;
  const tg = w.options.filter(isT), rest = w.options.filter((o) => !isT(o));
  const cellOf = (o) => (o.pos ? [o.pos.row, o.pos.col] : onBoard.get(o.card));
  if (tg.length && tg.every((o) => cellOf(o))) return { kind: 'board', tg, rest, cellOf };
  if (tg.length && tg.every((o) => o.card !== undefined && inHand.has(o.card))) return { kind: 'hand', tg, rest };
  if (w.options.some((o) => o.def)) return { kind: 'grid', tg: w.options.filter((o) => o.def), rest: w.options.filter((o) => !o.def) };
  return { kind: 'plain', tg: [], rest: w.options };
}

const selectable = (c) => !!c && !c.hidden && (c.owner === ME || c.puppet === ME);

function render() {
  document.body.classList.toggle('instart', !!showStart);
  $('start').hidden = !showStart;
  $('gamearea').hidden = showStart || !S;
  $('scorebox').hidden = showStart || !S;
  if (showStart) { renderStart(); $('overlay').innerHTML = ''; $('prompt').innerHTML = ''; return; }
  if (!S) return;
  const v = S.view;
  curMaps = cardMaps(v);
  const req = v.request;
  const mine = !!req && req.kind === 'action' && v.winner === null;
  const legal = mine ? S.legal : [];
  const ch = req && req.kind === 'choice' && v.winner === null ? choiceInfo(req, v) : null;
  if (ch && lastReqKey !== JSON.stringify(req)) { lastReqKey = JSON.stringify(req); pickedIds = []; }
  if (!ch) lastReqKey = null;
  if (insp !== null && !curMaps.has(insp)) insp = null;
  if (sel !== null && !curMaps.has(sel)) sel = null;
  if (!mine) { sel = null; pending = null; }

  // destinos da carta selecionada
  const dest = new Map();
  if (mine && sel !== null) {
    for (const a of legal) {
      if (a.t === 'move' && a.card === sel) dest.set(`${a.row},${a.col}`, { a, attack: !!v.board[a.row][a.col] });
      if (a.t === 'play' && a.card === sel) dest.set(`${myZ1()},${a.col}`, { a, attack: false });
    }
  }
  // alvos da escolha pendente
  const pick = new Map(); // "r,c" ou "h<uid>" -> opção
  if (ch && ch.kind === 'board') ch.tg.forEach((o) => { const [r, c] = ch.cellOf(o); pick.set(`${r},${c}`, o); });
  if (ch && ch.kind === 'hand') ch.tg.forEach((o) => pick.set('h' + o.card, o));

  $('sc0').textContent = v.treasure[ME];
  $('sc1').textContent = v.treasure[FOE];
  const phaseNames = { 0: 'Preparação', 1: 'Compra', 2: 'Preparação', 3: 'Assalto', 4: 'Final' };
  const pips = (n) => {
    const slots = Math.max(3, Math.min(n, 10)); // até 10 bolinhas; acima disso o número resume
    const dots = Array.from({ length: slots }, (_, i) => `<span class="pip ${i < n ? 'on' : ''}"></span>`).join('');
    return `<span class="pips" aria-label="${n} PA"><span class="dots${slots > 5 ? ' two' : ''}">${dots}</span>${n > 3 ? `<b class="pipn">${n}</b>` : ''}</span>`;
  };
  let who;
  if (v.winner !== null) who = 'Fim de partida';
  else if (req) who = req.kind === 'choice' ? 'Sua escolha' : 'Sua vez';
  else who = mode === 'bot' ? 'Bot jogando…' : 'Oponente jogando…';
  $('status').innerHTML = `<span class="who">${who}</span>
    <span class="long">Turno ${v.turn} · Fase ${v.phase || '-'} ${esc(phaseNames[v.phase])}</span><span class="short">T${v.turn} · ${esc(phaseNames[v.phase])}</span>
    <span>PA ${pips(v.pa[ME])}</span>
    <span class="spacer" style="flex:1"></span>
    <button class="btn primary" id="endturn" ${mine ? '' : 'disabled'}>Encerrar<span class="long"> turno</span></button>`;
  $('endturn').onclick = () => { submit({ t: 'endTurn' }); };

  // mesa
  const now = performance.now();
  fx = fx.filter((f) => f.t0 + f.dur > now);
  let html = '';
  for (const r of DISPLAY_ROWS()) {
    const cls = r === 2 ? 'row-t' : (r === 0 || r === 4) ? 'row-z1' : 'row-z2';
    html += `<div class="lab">${esc(rowLabel(r))}</div>`;
    for (let c = 0; c < 5; c++) {
      const cv = v.board[r][c];
      const d = dest.get(`${r},${c}`);
      const po = pick.get(`${r},${c}`);
      const pi = po ? pickedIds.indexOf(po.id) : -1;
      const pendHere = pending && pending.row === r && pending.col === c;
      const classes = ['cell', cls, d ? (d.attack ? 'attack' : 'target') : '', po ? 'choose' : '', pi >= 0 ? 'picked' : '',
        pendHere ? 'pending' : '', cv && cv.uid === sel ? 'sel' : '', cv && cv.uid === insp && cv.uid !== sel ? 'insp' : '', cv ? '' : 'blank'].join(' ');
      const label = cv ? (cv.hidden ? 'carta virada do oponente' : cv.name) : 'posição vazia';
      const fxs = fx.filter((f) => f.row === r && f.col === c).map((f) => {
        const off = Math.round(now - f.t0);
        return `<span class="fx fx-${f.kind}" style="animation-duration:${f.dur}ms;animation-delay:-${off}ms"><span class="ic">${f.icon}</span>${f.text ? `<span class="ft">${esc(f.text)}</span>` : ''}</span>`;
      }).join('');
      html += `<button class="${classes}" data-r="${r}" data-c="${c}" ${cv ? `data-u="${cv.uid}"` : ''} ${pi >= 0 ? `data-n="${pi + 1}"` : ''} aria-label="${esc(rowLabel(r))} coluna ${c + 1}: ${esc(label)}">${cv ? cardHTML(cv) : (r === 2 && v.destroyed && v.destroyed[c] ? `<span class="chest destroyed" title="posição destruída"><img src="${IMG_DESTROYED}" alt="" draggable="false" onerror="this.remove()"><span>destruído</span></span>` : r === 2 ? `<span class="chest"><img src="${IMG_CHEST}" alt="" draggable="false" onerror="this.remove()"><span>baú</span></span>` : '')}${fxs}</button>`;
    }
  }
  $('board').innerHTML = html;
  $('board').querySelectorAll('.cell').forEach((el) => {
    el.onclick = () => onCell(+el.dataset.r, +el.dataset.c, dest, pick, ch, v);
    if (canHover && el.dataset.u) {
      el.onmouseenter = () => { hover = +el.dataset.u; renderDetail(); };
      el.onmouseleave = () => { hover = null; renderDetail(); };
    }
  });

  // mão
  $('hand').innerHTML = v.hand.length
    ? v.hand.map((c) => {
      const po = pick.get('h' + c.uid), pi = po ? pickedIds.indexOf(po.id) : -1;
      return `<button class="hcard ${c.uid === sel ? 'sel' : ''} ${c.uid === insp && c.uid !== sel ? 'insp' : ''} ${po ? 'choose' : ''} ${pi >= 0 ? 'picked' : ''}" data-u="${c.uid}" ${pi >= 0 ? `data-n="${pi + 1}"` : ''}>${cardHTML(c, { full: true })}</button>`;
    }).join('')
    : '<span class="empty">Sem cartas na mão.</span>';
  $('hand').querySelectorAll('.hcard').forEach((el) => {
    const u = +el.dataset.u;
    el.onclick = () => onHand(u, pick, ch);
    if (canHover) {
      el.onmouseenter = () => { hover = u; renderDetail(); };
      el.onmouseleave = () => { hover = null; renderDetail(); };
    }
  });

  renderDetail();
  renderPrompt(v, ch, dest);

  const gy = (p) => v.graveyard[p].map((c) => esc(c.name)).join(', ') || '—';
  $('piles').innerHTML = `
    <div><small>Você</small><br>Baralho <b>${v.deckCount[ME]}</b> · Extra <b>${v.extraCount[ME]}</b><br>Cemitério: <b>${gy(ME)}</b></div>
    <div><small>${oppName()}</small><br>Baralho <b>${v.deckCount[FOE]}</b> · Extra <b>${v.extraCount[FOE]}</b> · Mão <b>${v.oppHandCount}</b><br>Cemitério: <b>${gy(FOE)}</b></div>`;

  const logEl = $('log');
  const stick = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
  logEl.innerHTML = v.log.map((l) => `<div class="${l.text.startsWith('──') ? 'turn' : ''}">${esc(nm(l.text))}</div>`).join('');
  if (stick) logEl.scrollTop = logEl.scrollHeight;
  $('seedinfo').textContent = `Partida nº ${seed}${mode === 'bot' ? ' (informe este número se achar um erro).' : '.'}`;

  renderOverlay(v, ch);
}

// ───────── cliques ─────────
function chooseIds(ids) { lastReqKey = null; pickedIds = []; submit({ t: 'choose', ids }); }

function togglePick(opt, w) {
  if (w.min === 1 && w.max === 1 && !w.ordered) { chooseIds([opt.id]); return; }
  const i = pickedIds.indexOf(opt.id);
  if (i >= 0) pickedIds.splice(i, 1); else if (pickedIds.length < w.max) pickedIds.push(opt.id);
  render();
}

function onCell(r, c, dest, pick, ch, v) {
  const po = pick.get(`${r},${c}`);
  if (po) { togglePick(po, v.request); return; }
  const d = dest.get(`${r},${c}`);
  if (d) {
    if (d.attack) {
      const t = v.board[r][c], att = curMaps.get(sel);
      pending = { a: d.a, row: r, col: c, target: t.hidden ? 'a carta virada' : t.name, attacker: att ? att.name : 'sua carta' };
      render();
    } else submit(d.a);
    return;
  }
  pending = null;
  const cv = v.board[r][c];
  clickCard(cv);
}

function onHand(u, pick, ch) {
  const po = pick.get('h' + u);
  if (po) { togglePick(po, S.view.request); return; }
  pending = null;
  clickCard(curMaps.get(u));
}

/** 1º clique inspeciona; 2º clique na mesma carta (se for sua e for a sua vez) seleciona. */
function clickCard(c) {
  if (!c) { insp = sel = null; render(); return; }
  const mine = !!S.view.request && S.view.request.kind === 'action' && S.view.winner === null;
  if (c.uid === insp && selectable(c) && mine) sel = sel === c.uid ? null : c.uid;
  else { insp = c.uid; sel = null; }
  render();
}

// ───────── painéis ─────────
function renderDetail() {
  if (!S) return;
  const v = S.view;
  const el = $('detail');
  const uid = hover !== null ? hover : (sel !== null ? sel : insp);
  if (uid === null) {
    el.innerHTML = `<div class="dtext"><h3>Escolha uma carta</h3><p class="hint">${canHover ? 'Passe o mouse sobre uma carta para lê-la.' : 'Toque numa carta para lê-la.'}</p></div>`;
    return;
  }
  const c = curMaps.get(uid);
  if (!c) { el.innerHTML = ''; return; }
  if (c.hidden) { el.innerHTML = `<div class="dtext"><h3>Carta virada do oponente</h3><p class="hint">Só se revela quando virar pra cima.</p></div>`; return; }
  const typeTxt = c.type ? ` (${esc(c.type)})` : '';
  const big = cardImg(c.defId, c.img);
  el.innerHTML = `${big ? `<img class="bigart" src="${big}" alt="${esc(c.name)}" onerror="this.remove()">` : ''}<div class="dtext"><h3>${esc(c.name)}</h3>
    <div class="sub">${esc(c.cls)}${typeTxt}${c.speed ? ' · ' + esc(c.speed) : ''}${c.owner === FOE ? ' · do ' + (mode === 'bot' ? 'bot' : 'oponente') : ''}</div>
    <p>${esc(c.text)}</p></div>`;
  const im = el.querySelector('.bigart');
  if (im) im.onclick = () => {
    const z = $('zoom');
    z.innerHTML = `<div class="modal"><img src="${big}" alt="${esc(c.name)}"></div>`;
    z.firstChild.onclick = () => { z.innerHTML = ''; };
  };
}

/** Barra fixa acima da mesa (altura constante): decisões pendentes, ações da carta selecionada ou uma dica. */
function renderPrompt(v, ch, dest) {
  const p = $('prompt');
  const idle = (msg) => { p.innerHTML = `<div class="prompt idle">${msg}</div>`; };
  if (pending) {
    p.innerHTML = `<div class="prompt atk"><div class="pm"><b>Atacar ${esc(pending.target)} com ${esc(pending.attacker)}?</b><span class="hint">A carta atacada morre se o ataque for bem-sucedido.</span></div>
      <div class="pb"><button class="btn primary" id="pk-yes">Atacar</button><button class="btn" id="pk-no">Cancelar</button></div></div>`;
    $('pk-yes').onclick = () => submit(pending.a);
    $('pk-no').onclick = () => { pending = null; render(); };
    return;
  }
  if (ch && ch.kind !== 'grid') {
    const w = v.request;
    const multi = !(w.min === 1 && w.max === 1 && !w.ordered);
    const hint = ch.kind === 'board' ? 'Clique na carta ou posição destacada na mesa.'
      : ch.kind === 'hand' ? 'Clique numa carta destacada da sua mão.' : '';
    const sub = multi ? ` Escolha de ${w.min} a ${w.max}${w.ordered ? ', na ordem desejada' : ''}.` : '';
    p.innerHTML = `<div class="prompt decide"><div class="pm"><b>${esc(nm(w.message))}</b>${hint || sub ? `<span class="hint">${hint}${sub}</span>` : ''}</div>
      <div class="pb">${ch.rest.map((o) => `<button class="btn ${o.id === 'yes' ? 'primary' : ''}" data-id="${esc(o.id)}">${esc(nm(o.label))}</button>`).join('')}
      ${multi && ch.tg.length ? `<button class="btn primary" id="pk-ok" ${pickedIds.length >= w.min && pickedIds.length <= w.max ? '' : 'disabled'}>Confirmar</button>` : ''}</div></div>`;
    p.querySelectorAll('[data-id]').forEach((b) => { b.onclick = () => chooseIds([b.dataset.id]); });
    const ok = $('pk-ok'); if (ok) ok.onclick = () => chooseIds(pickedIds.slice());
    return;
  }
  if (ch) { idle('Escolha uma das cartas na janela.'); return; }
  const mineTurn = !!v.request && v.request.kind === 'action' && v.winner === null;
  const c = sel !== null ? curMaps.get(sel) : null;
  if (c && mineTurn && selectable(c)) {
    const inHand = v.hand.some((h) => h.uid === sel);
    if (inHand) {
      p.innerHTML = `<div class="prompt act"><span class="sel-name">${esc(c.name)}</span><span class="hint">${c.type === 'Maldição' ? 'Maldição só sai da mão por descarte.' : 'Escolha uma coluna destacada na sua Z1 para jogá-la.'}</span></div>`;
    } else {
      p.innerHTML = `<div class="prompt act"><span class="sel-name">${esc(c.name)}</span><div class="pb" id="acts"></div></div>`;
      const box = p.querySelector('#acts');
      const acts = S.acts[sel] || [];
      acts.forEach((a) => {
        const b = document.createElement('button');
        b.className = 'btn' + (a.err ? ' off' : '');
        b.textContent = a.label;
        b.onclick = () => { if (a.err) toast(a.err); else submit(a.action); };
        box.appendChild(b);
      });
      const hint = document.createElement('span'); hint.className = 'hint';
      hint.textContent = 'ou clique numa posição destacada para mover/atacar.';
      box.appendChild(hint);
    }
    return;
  }
  const ic = insp !== null ? curMaps.get(insp) : null;
  if (ic && mineTurn && selectable(ic)) { idle(`Clique de novo em <b style="color:var(--text)">${esc(ic.name)}</b> para selecioná-la.`); return; }
  idle(canHover ? 'Passe o mouse sobre uma carta para lê-la; clique nela de novo (se for sua) para agir.' : 'Toque numa carta para lê-la; toque de novo (se for sua) para agir.');
}

function defCard(defId) {
  const d = LIBRARY[defId].def;
  return { uid: -1, defId, img: d.img, name: d.name, cls: d.cls, type: d.type, speed: d.speed, text: d.text, owner: ME, faceDown: false, exhausted: false, blocked: false, contActive: false, hidden: false };
}

function renderOverlay(v, ch) {
  const o = $('overlay');
  if (lost) {
    o.innerHTML = `<div class="modal"><div class="box end"><h2>Conexão perdida</h2>
      <div>A conexão com o outro jogador caiu. Esta partida não pode ser retomada.</div>
      <button class="btn primary" id="leave2">Voltar ao menu inicial</button></div></div>`;
    $('leave2').onclick = leaveOnline;
    return;
  }
  if (v.winner !== null) {
    const t = v.winner === 'draw' ? 'Empate' : v.winner === ME ? 'Você venceu!' : `${oppName() === 'Bot' ? 'O bot' : 'O oponente'} venceu`;
    if (!endSounded) { endSounded = true; (v.winner === ME ? SND.win : SND.lose)(); }
    o.innerHTML = `<div class="modal"><div class="box end"><h2>${t}</h2>
      <div>Tesouros: você ${v.treasure[ME]} × ${v.treasure[FOE]} ${oppName().toLowerCase()}.</div>
      <div class="actions"><button class="btn primary" id="again">Jogar de novo</button>
      ${mode === 'bot' ? '<button class="btn" id="menu">Trocar baralhos</button>' : ''}</div></div></div>`;
    $('again').onclick = () => { o.innerHTML = ''; newGame(); };
    const mb = $('menu'); if (mb) mb.onclick = () => { showStart = true; render(); };
    return;
  }
  if (ch && ch.kind === 'grid') {
    const w = v.request;
    const multi = !(w.min === 1 && w.max === 1 && !w.ordered);
    o.innerHTML = `<div class="modal"><div class="box wide"><h2>${esc(nm(w.message))}</h2>
      ${multi ? `<div class="hint">Escolha de ${w.min} a ${w.max}${w.ordered ? ', na ordem desejada' : ''}.</div>` : ''}
      <div class="handrow">${ch.tg.map((op) => {
        const i = pickedIds.indexOf(op.id);
        return `<button class="hcard choose ${i >= 0 ? 'picked' : ''}" data-id="${esc(op.id)}" ${i >= 0 ? `data-n="${i + 1}"` : ''}>${cardHTML(defCard(op.def), { full: true })}</button>`;
      }).join('')}</div>
      ${ch.rest.length ? `<div class="actions">${ch.rest.map((r) => `<button class="btn" data-rest="${esc(r.id)}">${esc(nm(r.label))}</button>`).join('')}</div>` : ''}
      ${multi ? `<button class="btn primary" id="confirm" ${pickedIds.length >= w.min && pickedIds.length <= w.max ? '' : 'disabled'}>Confirmar</button>` : ''}
    </div></div>`;
    o.querySelectorAll('[data-id]').forEach((b) => { b.onclick = () => togglePick(w.options.find((x) => x.id === b.dataset.id), w); });
    o.querySelectorAll('[data-rest]').forEach((b) => { b.onclick = () => { o.innerHTML = ''; chooseIds([b.dataset.rest]); }; });
    const cf = $('confirm'); if (cf) cf.onclick = () => { const ids = pickedIds.slice(); o.innerHTML = ''; chooseIds(ids); };
    return;
  }
  o.innerHTML = '';
}

// ───────── importar deck (CSV) ─────────
function importDeckFile(slot) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.csv,.txt,text/csv,text/plain';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    let text = '';
    try { text = await f.text(); } catch (e) { importErr[slot] = { file: f.name, errors: ['Não consegui ler o arquivo.'] }; renderStart(); return; }
    const r = RD.parseDeckCsv(text, LIBRARY);
    if (r.errors.length) importErr[slot] = { file: f.name, errors: r.errors };
    else {
      importErr[slot] = null;
      customDecks[slot] = { name: f.name.replace(/\.[^.]+$/, ''), ids: r.ids };
      startDecks[slot] = 'custom';
      saveCustom();
    }
    renderStart();
  };
  inp.click();
}

// ───────── tela inicial ─────────
function renderStart() {
  const DESC = { piratas: 'Jogue com os piratas e monstros mais temidos do mar sussurrante.', circo: 'Jogue com o incrível e mortal circo de aberrações itinerante.' };
  const tile = (grp, id, label, sub) => `<button class="tile ${grp === 'level' ? 'lv ' : ''}${startDecks[grp] === id ? 'on' : ''}" data-g="${grp}" data-d="${id}" aria-pressed="${startDecks[grp] === id}"><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</button>`;
  const deckGroup = (grp, title) => {
    const c = customDecks[grp], er = importErr[grp];
    const tiles = ['piratas', 'circo'].map((d) => tile(grp, d, DECK_NAMES[d], DESC[d]));
    if (c) tiles.push(tile(grp, 'custom', esc(c.name), '15 cartas escolhidas por você'));
    const errs = er ? `<div class="errbox"><b>Não foi possível importar "${esc(er.file)}":</b><ul>${er.errors.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
    return `<div class="grp"><h3 class="gl">${title}</h3><div class="tiles">${tiles.join('')}</div>
      <div class="imp"><button class="btn sm" data-imp="${grp}">Importar deck</button><button class="btn sm" data-build="${grp}">Criar deck</button></div>${errs}</div>`;
  };
  $('start').innerHTML = `<div class="startbox">
    <h2>Nova partida</h2>
    ${deckGroup('mine', 'Seu Baralho')}
    ${deckGroup('foe', 'Baralho do Bot')}
    <div class="grp"><h3 class="gl">Dificuldade</h3><div class="tiles lvl">${[['facil', 'Fácil'], ['normal', 'Normal'], ['dificil', 'Difícil']].map(([id, l]) => tile('level', id, l, '')).join('')}</div></div>
    <div class="actions"><button class="btn primary" id="go">Iniciar partida</button>
      ${S && S.view.winner === null && mode === 'bot' ? '<button class="btn" id="back">Voltar à partida</button>' : ''}</div>
  </div>`;
  $('start').querySelectorAll('.tile').forEach((b) => { b.onclick = () => { startDecks[b.dataset.g] = b.dataset.d; if (b.dataset.g === 'level') { try { localStorage.setItem('rd-level', b.dataset.d); } catch (e) {} } renderStart(); }; });
  $('start').querySelectorAll('[data-imp]').forEach((b) => { b.onclick = () => importDeckFile(b.dataset.imp); });
  $('start').querySelectorAll('[data-build]').forEach((b) => { b.onclick = () => openBuilder(b.dataset.build); });
  $('go').onclick = () => { if (mode !== 'bot') leaveOnline(); botLevel = startDecks.level; startGame([resolveDeck(startDecks.mine, 'mine'), resolveDeck(startDecks.foe, 'foe')]); };
  const bk = $('back'); if (bk) bk.onclick = () => { showStart = false; pump(); };
}

// ───────── inicialização ─────────
$('newgame').onclick = () => { clearTimeout(botTimer); showStart = true; render(); };
$('online').onclick = () => { lobby = { step: 'menu' }; renderLobby(); };
$('manual').onclick = openManual;
$('leave').onclick = leaveOnline;
$('snd').onclick = () => setSound(!soundOn);
$('snd').textContent = soundOn ? '🔊' : '🔇';
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (sel !== null || insp !== null || pending)) { sel = insp = null; pending = null; render(); }
});
render();
window.__rd = { get mode() { return mode; }, get S() { return S; }, get g() { return g; }, get sel() { return sel; }, get insp() { return insp; }, get fx() { return fx; } };

// ───────── Manual de regras e montador de deck ─────────
const MANUAL = [
  ['Objetivo', `<p>Seja o primeiro a juntar <b>10 tesouros</b>. A partida também termina por efeito de carta (Taika, Loucura, Donzela) ou quando o Baralho de quem começa a vez está vazio na Fase de Compra: vence quem tiver mais tesouros (iguais = empate).</p>`],
  ['A mesa', `<p>São 5 linhas: Zona 1 e Zona 2 de cada jogador, com a <b>Zona do Tesouro</b> (5 baús) no meio, compartilhada. Cada posição guarda 1 carta e não há diagonais. Suas cartas só entram na sua Zona 1 (viradas pra baixo) e se movem para posições vizinhas das suas zonas e da Zona do Tesouro. Mover para uma posição ocupada é um <b>ataque</b>: a carta atacada morre (se não puder morrer, o movimento é proibido).</p>`],
  ['O turno', `<ol><li><b>Compra:</b> você recebe 3 pontos de ação (PA, não acumulam) e compra 1 carta. No 1º turno, sem Espião na mão, pode fazer mulligan.</li><li><b>Preparação:</b> suas cartas viram pra cima, as exaustas são preparadas e os Ladrões usam a Habilidade de roubar 1 tesouro na Zona do Tesouro.</li><li><b>Assalto:</b> gaste PA em qualquer ordem (jogar uma carta virada pra baixo na Zona 1, mover, atacar, usar poder, roubar tesouro).</li><li><b>Final:</b> descarte até ficar com 6 cartas na mão.</li></ol>`],
  ['Poderes', `<p><b>Rápida:</b> resolve na hora. <b>Lenta:</b> vale durante o próximo turno do oponente. <b>Contínua:</b> fica ativa até a carta ser preparada, morrer, sair da mesa ou virar pra baixo. Usar um poder custa 1 PA e exaure a carta. Cartas viradas pra baixo não são afetadas por poderes, a menos que o poder diga o contrário.</p><p><b>Espiões</b> viradas pra baixo podem <b>bloquear</b> o poder de uma carta inimiga: o poder é cancelado, mas o PA é gasto.</p>`],
  ['Classes', `<p><b>Assassino</b> mata cartas. <b>Ladrão</b> rouba tesouros. <b>Espião</b> bloqueia e manipula. <b>Maníaco</b> cria Capangas. Cada classe tem uma Habilidade própria na Preparação ou no ataque.</p>`],
  ['Tipos', `<p><b>Evasiva</b>: vira pra baixo (0 PA). <b>Voador</b>: volta à mão (0 PA). <b>Invulnerável</b>: só um Exterminador a mata. <b>Obstáculo</b>: só um Fortão a mata. <b>Regenerativa</b>: pode voltar à mão ao morrer. <b>Sorrateira</b>: ao bloquear, mata a carta bloqueada. <b>Vingativa</b>: ao ser bloqueada, mata quem bloqueou. <b>Maldição</b>: só sai da mão por descarte e não pode ser jogada.</p>`],
  ['Capangas', `<p>Capangas são criados por Maníacos e vêm do baralho <b>Extra</b> (que não conta como mão nem baralho). Ao morrer, voltar à mão ou sair do local onde foram criados, voltam ao Extra do dono. Têm só o efeito escrito (e os tipos); Habilidades de classe passivas valem (o Pirata tem a do Ladrão).</p>`],
  ['Baralho', `<p>Um baralho tem exatamente <b>15 cartas diferentes</b> (sem Capangas). Monte o seu em <b>Criar deck</b> ou importe um CSV.</p>`],
];

function openManual() {
  $('dlg').innerHTML = `<div class="modal" id="dlg-bg"><div class="box wide manual"><h2>Manual de regras</h2>
    <p class="hint">Resumo das regras implementadas neste jogo.</p>
    ${MANUAL.map(([t, h]) => `<section><h3>${t}</h3>${h}</section>`).join('')}
    <div class="actions"><button class="btn primary" id="dlg-close">Fechar</button></div></div></div>`;
  $('dlg-close').onclick = closeDlg;
  $('dlg-bg').onclick = (e) => { if (e.target.id === 'dlg-bg') closeDlg(); };
}
function closeDlg() { $('dlg').innerHTML = ''; }

const CLASS_ORDER = ['Assassino', 'Ladrão', 'Espião', 'Maníaco'];
function openBuilder(slot) {
  const cards = CATALOG.filter((e) => e.cls !== 'Capanga' && LIBRARY[e.id]);
  const cur = customDecks[slot];
  let picked = new Set(cur ? cur.ids : (startDecks[slot] && startDecks[slot] !== 'custom' ? (Array.isArray(DECKS[startDecks[slot]]) ? DECKS[startDecks[slot]] : []) : []));
  picked = new Set([...picked].filter((id) => cards.some((c) => c.id === id)));
  let filter = 'Todas', name = cur ? cur.name : 'Meu deck';
  const draw = () => {
    const shown = cards.filter((c) => filter === 'Todas' || c.cls === filter);
    const n = picked.size;
    $('dlg').innerHTML = `<div class="modal" id="dlg-bg"><div class="box wide builder"><h2>Criar deck</h2>
      <div class="bhead"><label class="pick">Nome<input id="dname" type="text" maxlength="40" value="${esc(name)}"></label>
        <div class="count ${n === 15 ? 'ok' : ''}"><b>${n}</b> / 15</div></div>
      <div class="filters">${['Todas', ...CLASS_ORDER].map((f) => `<button class="chip ${f === filter ? 'on' : ''}" data-f="${f}">${f}</button>`).join('')}</div>
      <div class="cgrid">${shown.map((c) => `<button class="bc ${picked.has(c.id) ? 'on' : ''}" data-id="${c.id}" title="${esc(c.name + ' (' + c.cls + ') — ' + c.text)}">
          <img src="${cardImg(c.id, null)}" alt="${esc(c.name)}" loading="lazy" draggable="false" onerror="this.remove()"><span>${esc(c.name)}</span></button>`).join('')}</div>
      <div class="actions"><button class="btn primary" id="dsave" ${n === 15 ? '' : 'disabled'}>Usar este deck</button>
        <button class="btn" id="dcopy" ${n ? '' : 'disabled'}>Copiar lista (CSV)</button>
        <button class="btn" id="dclear">Limpar</button><button class="btn" id="dclose">Cancelar</button></div></div></div>`;
    $('dname').oninput = (e) => { name = e.target.value; };
    $('dlg').querySelectorAll('[data-f]').forEach((b) => { b.onclick = () => { filter = b.dataset.f; draw(); }; });
    $('dlg').querySelectorAll('.bc').forEach((b) => {
      b.onclick = () => {
        const id = b.dataset.id;
        if (picked.has(id)) picked.delete(id); else if (picked.size < 15) picked.add(id); else { toast('O deck já tem 15 cartas.'); return; }
        const sc = $('dlg').querySelector('.cgrid').scrollTop, bs = $('dlg').querySelector('.box').scrollTop;
        draw(); $('dlg').querySelector('.cgrid').scrollTop = sc; $('dlg').querySelector('.box').scrollTop = bs;
      };
    });
    $('dclear').onclick = () => { picked.clear(); draw(); };
    $('dclose').onclick = closeDlg;
    $('dlg-bg').onclick = (e) => { if (e.target.id === 'dlg-bg') closeDlg(); };
    $('dcopy').onclick = () => {
      const txt = [...picked].map((id) => (cards.find((c) => c.id === id) || {}).name).join('\n');
      try { navigator.clipboard.writeText(txt).then(() => toast('Lista copiada.'), () => toast('Não consegui copiar.')); } catch (e) { toast('Não consegui copiar.'); }
    };
    $('dsave').onclick = () => {
      const ids = [...picked];
      if (Game.validateDeck(ids, LIBRARY).length) { toast('Deck inválido.'); return; }
      customDecks[slot] = { name: (name || 'Meu deck').trim() || 'Meu deck', ids };
      startDecks[slot] = 'custom'; importErr[slot] = null; saveCustom();
      closeDlg(); renderStart();
    };
  };
  draw();
}

})();</script>
