<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Rogue Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: mesa 5x5 com o bot no topo e você embaixo; painel lateral com a carta escolhida e o registro. */
  :root {
    --bg: #0e1615;
    --panel: #16211f;
    --line: #2a3b38;
    --text: #e9e5d9;
    --muted: #98a7a2;
    --gold: #d6ac3a;
    --me: #4fb0ab;
    --foe: #d0614a;
    --paper: #ece5d2;
    --ink: #1c211f;
    --back: #243541;
    --c-assassino: #a33636;
    --c-ladrao: #8c6a14;
    --c-espiao: #2f6694;
    --c-maniaco: #74449a;
    --c-capanga: #5d625f;
    --font-display: "Cinzel", Georgia, "Times New Roman", serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font: 400 14px/1.45 var(--font-body);
    padding-block: 12px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  h1 { font: 700 22px/1 var(--font-display); letter-spacing: .08em; margin: 0; text-transform: uppercase; }
  .spacer { flex: 1; }
  .score { display: flex; gap: 14px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .score b { font-size: 20px; }
  .score .me b { color: var(--me); }
  .score .foe b { color: var(--foe); }
  .score small, .stat small { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .btn { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; border-radius: 6px; }
  .btn:hover:not(:disabled) { border-color: var(--gold); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #1d1a0e; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .status .who { font-weight: 600; }
  .pips { display: inline-flex; gap: 4px; vertical-align: middle; }
  .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gold); }
  .pip.on { background: var(--gold); }

  .layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 330px; } }
  .stack { display: grid; gap: 14px; min-width: 0; align-content: start; }

  .board { display: grid; grid-template-columns: 38px repeat(5, minmax(0, 1fr)); gap: 5px; }
  .lab { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; text-align: right; padding-right: 2px; line-height: 1.1; }
  .cell { position: relative; aspect-ratio: 5 / 6; min-height: 70px; border: 1px solid var(--line); border-radius: 6px; background: #121c1a; padding: 0; display: block; width: 100%; text-align: left; }
  .row-z1 .cell { background: #101918; }
  .row-t .cell { background: #1b1a10; border-color: #4a4120; }
  .chest { position: absolute; inset: 0; display: grid; place-items: center; color: #8f7d38; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .cell.target { outline: 2px solid var(--me); outline-offset: -2px; background: #14302f; }
  .cell.attack { outline: 2px solid var(--foe); outline-offset: -2px; }
  .cell.target::before, .cell.attack::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .08; pointer-events: none; }
  .cell.target { color: var(--me); } .cell.attack { color: var(--foe); }

  .card { position: absolute; inset: 2px; border-radius: 5px; background: var(--paper); color: var(--ink); padding: 4px 5px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; border-top: 4px solid var(--me); }
  .card.foe { border-top-color: var(--foe); }
  .card .nm { font: 600 11px/1.1 var(--font-body); overflow-wrap: anywhere; }
  .card .meta { font-size: 9px; color: #4b524f; line-height: 1.15; }
  .card .badge { align-self: flex-start; font-size: 9px; font-weight: 700; color: #fff; padding: 1px 5px; border-radius: 99px; background: var(--c-capanga); }
  .cls-Assassino .badge { background: var(--c-assassino); } .cls-Ladrão .badge { background: var(--c-ladrao); }
  .cls-Espião .badge { background: var(--c-espiao); } .cls-Maníaco .badge { background: var(--c-maniaco); }
  .tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 2px; }
  .tag { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 4px; border-radius: 3px; background: #2b3532; color: #e9e5d9; }
  .tag.red { background: #8e2e22; } .tag.gold { background: #7a5d10; }
  .card.down { background: var(--back); color: var(--text); background-image: repeating-linear-gradient(45deg, transparent 0 7px, rgba(255,255,255,.05) 7px 8px); }
  .card.down .meta { color: #b3c0ca; }
  .card.hiddenfoe { align-items: center; justify-content: center; font-size: 11px; color: #9fb0bb; }
  .card.exh { opacity: .72; filter: saturate(.6); }
  .cell.sel { outline: 3px solid var(--gold); outline-offset: -1px; z-index: 1; }

  .hand { display: grid; gap: 8px; }
  .hand h2, .side h2 { margin: 0; font: 600 12px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .handrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .hcard { text-align: left; position: relative; width: 132px; min-height: 150px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; }
  .hcard .card { position: static; height: 100%; min-height: 148px; }
  .hcard .txt { font-size: 10px; line-height: 1.25; color: #343b38; }
  .hcard.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
  .empty { color: var(--muted); font-style: italic; }

  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
  .detail h3 { margin: 0 0 2px; font: 700 17px/1.2 var(--font-display); letter-spacing: .03em; }
  .detail .sub { color: var(--muted); font-size: 12px; }
  .detail p { margin: 8px 0; }
  .actions { display: grid; gap: 6px; }
  .why { color: var(--muted); font-size: 11px; margin-top: -2px; }
  .log { max-height: 280px; overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; display: grid; gap: 3px; }
  .log div { color: #c9d1cc; } .log .turn { color: var(--gold); margin-top: 4px; font-weight: 600; }
  .piles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); }
  .piles div { background: #121c1a; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .piles b { color: var(--text); font-weight: 600; }

  .modal { position: fixed; inset: 0; background: rgba(5, 9, 8, .72); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal .box { width: min(480px, 100%); max-height: 86vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  .modal h2 { margin: 0; font: 700 18px/1.25 var(--font-display); }
  .opts { display: grid; gap: 6px; }
  .opt { text-align: left; background: #121c1a; border: 1px solid var(--line); padding: 9px 11px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
  .opt:hover { border-color: var(--gold); }
  .opt.picked { border-color: var(--gold); background: #2a2410; }
  .opt .n { min-width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--gold); display: grid; place-items: center; font-size: 11px; color: var(--gold); }
  .opt.picked .n { background: var(--gold); color: #1d1a0e; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #3a1a15; border: 1px solid var(--foe); color: var(--text); padding: 8px 14px; border-radius: 6px; z-index: 60; max-width: calc(100% - 32px); }
  .end h2 { font-size: 26px; }
  .hint { color: var(--muted); font-size: 12px; }

  @media (max-width: 520px) {
    .board { grid-template-columns: 30px repeat(5, minmax(0, 1fr)); gap: 3px; }
    .card .nm { font-size: 9.5px; } .card .meta { font-size: 8px; } .card { padding: 3px; }
    .hcard { width: calc(50% - 4px); }
  }
  @media (prefers-reduced-motion: no-preference) { .cell, .hcard { transition: outline-color .15s; } }
</style>

<div class="wrap" id="app">
  <header>
    <h1>Rogue Duel</h1>
    <div class="score" aria-live="polite">
      <span class="me"><small>Você</small> <b id="sc0">0</b></span>
      <span class="foe"><small>Bot</small> <b id="sc1">0</b></span>
      <small>10 tesouros vencem</small>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="newgame">Nova partida</button>
  </header>

  <div class="status" id="status"></div>

  <div class="layout">
    <div class="stack">
      <div class="board" id="board" aria-label="Mesa"></div>
      <div class="hand">
        <h2>Sua mão</h2>
        <div class="handrow" id="hand"></div>
      </div>
    </div>
    <aside class="stack">
      <section class="side detail" id="detail" aria-live="polite"></section>
      <section class="side">
        <div class="piles" id="piles"></div>
        <h2>Registro</h2>
        <div class="log" id="log"></div>
        <div class="hint" id="seedinfo"></div>
      </section>
    </aside>
  </div>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

<script>(() => {
  // dist/types.js
  var other = (p) => p === 0 ? 1 : 0;
  // dist/game.js
  class GameOver extends Error {
    winner;
    constructor(winner) {
      super("game over");
      this.winner = winner;
    }
  }
  var ROWS = 5;
  var COLS = 5;
  var TREASURE_ROW = 2;
  var WIN_TREASURE = 10;
  var HAND_LIMIT = 6;
  var PA_PER_TURN = 3;
  var z1Row = (p) => p === 0 ? 0 : 4;
  var z2Row = (p) => p === 0 ? 1 : 3;
  var backDir = (p) => p === 0 ? -1 : 1;
  var allowedRows = (p) => [z1Row(p), z2Row(p), TREASURE_ROW];
  function zoneLabel(row, col) {
    const names = ["J1·Z1", "J1·Z2", "Tesouro", "J2·Z2", "J2·Z1"];
    return `${names[row]} c${col + 1}`;
  }
  var hasAbility = (c, cls) => c.def.cls === cls || c.def.abilityOf === cls;
  var newPlayer = () => ({
    deck: [],
    hand: [],
    graveyard: [],
    extra: [],
    banished: [],
    treasure: 0,
    pa: 0,
    turnsTaken: 0,
    drawnThisTurn: 0
  });

  class Game {
    library;
    cards = new Map;
    players = [newPlayer(), newPlayer()];
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    turn = 0;
    active = 0;
    phase = 0;
    winner = null;
    waiting = null;
    watchers = [];
    logs = [];
    seq = 0;
    firstPlayer;
    uidCounter = 1;
    watcherCounter = 1;
    rng;
    co;
    constructor(opts) {
      this.library = opts.library;
      this.rng = (opts.seed ?? Date.now()) >>> 0;
      if (!opts.skipDeckValidation) {
        for (const p of [0, 1]) {
          const errs = Game.validateDeck(opts.decks[p], opts.library);
          if (errs.length)
            throw new Error(`Baralho do jogador ${p + 1} inválido: ${errs.join("; ")}`);
        }
      }
      for (const p of [0, 1]) {
        for (const id of opts.decks[p]) {
          const c = this.newCard(p, id);
          this.place(c, { z: "deck", p });
        }
      }
      this.firstPlayer = opts.firstPlayer ?? (this.random() < 0.5 ? 0 : 1);
      this.co = this.main();
      this.step(undefined);
    }
    static validateDeck(ids, library) {
      const errs = [];
      if (ids.length !== 15)
        errs.push(`precisa ter exatamente 15 cartas (tem ${ids.length})`);
      const seen = new Set;
      for (const id of ids) {
        const e = library[id];
        if (!e)
          errs.push(`carta desconhecida: ${id}`);
        else if (e.def.cls === "Capanga")
          errs.push(`Capanga não vai no baralho: ${e.def.name}`);
        if (seen.has(id))
          errs.push(`cópia repetida: ${id}`);
        seen.add(id);
      }
      return errs;
    }
    random() {
      this.rng = this.rng + 1831565813 >>> 0;
      let t = this.rng;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    shuffle(arr) {
      for (let i = arr.length - 1;i > 0; i--) {
        const j = Math.floor(this.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    card(uid) {
      const c = this.cards.get(uid);
      if (!c)
        throw new Error(`carta inexistente: ${uid}`);
      return c;
    }
    logPush(text) {
      this.logs.push({ turn: this.turn, text });
    }
    pos(c) {
      return c.loc && c.loc.z === "board" ? { row: c.loc.row, col: c.loc.col } : null;
    }
    onBoard(c) {
      return !!c.loc && c.loc.z === "board";
    }
    cardAt(row, col) {
      const u = this.board[row]?.[col];
      return u == null ? null : this.card(u);
    }
    boardCards(filter) {
      const out = [];
      for (let r = 0;r < ROWS; r++)
        for (let c = 0;c < COLS; c++) {
          const u = this.board[r][c];
          if (u != null) {
            const ci = this.card(u);
            if (!filter || filter(ci))
              out.push(ci);
          }
        }
      return out;
    }
    cardsInZone(p, z) {
      return this.players[p][z].map((u) => this.card(u));
    }
    cardLabel(c) {
      const p = this.pos(c);
      return p ? `${c.def.name} (${zoneLabel(p.row, p.col)})` : c.def.name;
    }
    createPositions(p) {
      const out = [];
      for (let r = 0;r < ROWS; r++) {
        if (r === z1Row(other(p)))
          continue;
        for (let c = 0;c < COLS; c++)
          if (this.board[r][c] == null)
            out.push({ row: r, col: c });
      }
      return out;
    }
    canKill(source, target) {
      if (target.def.type === "Invulnerável")
        return source?.def.type === "Exterminador";
      if (target.def.type === "Obstáculo")
        return source?.def.type === "Fortão";
      return true;
    }
    newCard(owner, defId) {
      const entry = this.library[defId];
      if (!entry)
        throw new Error(`carta desconhecida: ${defId}`);
      const c = {
        uid: this.uidCounter++,
        def: entry.def,
        owner,
        loc: null,
        faceDown: false,
        exhausted: false,
        blocked: false,
        contActive: false,
        stoleThisTurn: false,
        noPrepare: false,
        home: null,
        zoneSeq: 0
      };
      this.cards.set(c.uid, c);
      return c;
    }
    debugSpawn(owner, defId, dest, flags = {}) {
      const c = this.newCard(owner, defId);
      c.home = dest.z;
      this.place(c, dest);
      Object.assign(c, flags);
      return c;
    }
    place(c, dest, opts = {}) {
      let d = dest;
      if (c.def.cls === "Capanga" && c.home && d.z !== "extra" && d.z !== c.home && !c.def.alsoIn?.includes(d.z)) {
        d = { z: "extra", p: c.owner };
      }
      const old = c.loc;
      if (old) {
        if (old.z === "board")
          this.board[old.row][old.col] = null;
        else {
          const arr = this.players[old.p][old.z];
          const i = arr.indexOf(c.uid);
          if (i >= 0)
            arr.splice(i, 1);
        }
      }
      if (d.z === "board") {
        if (this.board[d.row][d.col] != null)
          throw new Error("posição ocupada");
        this.board[d.row][d.col] = c.uid;
      } else {
        const arr = this.players[d.p][d.z];
        if (opts.top)
          arr.unshift(c.uid);
        else
          arr.push(c.uid);
      }
      c.loc = d;
      c.zoneSeq = ++this.seq;
      if (!(old && old.z === "board" && d.z === "board")) {
        c.faceDown = false;
        c.exhausted = false;
        c.blocked = false;
        c.noPrepare = false;
        this.cancelPowersOf(c);
      }
    }
    createCapanga(owner, defId, dest) {
      const P = this.players[owner];
      let inst = P.extra.map((u) => this.card(u)).find((x) => x.def.id === defId);
      if (!inst)
        inst = this.newCard(owner, defId);
      inst.home = dest.z;
      this.place(inst, dest);
      inst.faceDown = false;
      this.logPush(`J${owner + 1} cria "${inst.def.name}".`);
      return inst;
    }
    cancelPowersOf(c) {
      this.watchers = this.watchers.filter((w) => w.source !== c.uid);
      c.contActive = false;
    }
    prepareCard(c) {
      c.exhausted = false;
      c.blocked = false;
      this.cancelPowersOf(c);
    }
    addWatcher(w) {
      const full = { ...w, source: w.source.uid, id: this.watcherCounter++, seq: ++this.seq };
      this.watchers.push(full);
      return full;
    }
    *choose(player, message, options, min = 1, max = 1, ordered = false) {
      if (options.length === 0)
        return [];
      min = Math.min(min, options.length);
      max = Math.min(max, options.length);
      const input = yield { kind: "choice", player, message, options, min, max, ordered };
      return input.ids;
    }
    *chooseCard(player, message, cards) {
      if (cards.length === 0)
        return null;
      if (cards.length === 1)
        return cards[0];
      const [id] = yield* this.choose(player, message, cards.map((c) => ({ id: String(c.uid), label: this.cardLabel(c) })));
      return this.card(Number(id));
    }
    *chooseYesNo(player, message) {
      const [a] = yield* this.choose(player, message, [
        { id: "yes", label: "Sim" },
        { id: "no", label: "Não" }
      ]);
      return a === "yes";
    }
    *emit(name, data = {}) {
      const entries = [];
      for (const w of this.watchers) {
        if (w.event !== name)
          continue;
        entries.push({
          seq: w.seq,
          active: () => this.watchers.includes(w) && (!w.cond || w.cond(this, data)),
          run: () => w.run(this, data)
        });
      }
      for (const c of this.cards.values()) {
        const trigs = this.library[c.def.id]?.triggers;
        if (!trigs)
          continue;
        for (const t of trigs) {
          if (t.event !== name)
            continue;
          entries.push({
            seq: c.zoneSeq,
            active: () => !!c.loc && t.zones.includes(c.loc.z) && (c.loc.z !== "board" || !c.faceDown) && (!t.cond || t.cond(this, c, data)),
            run: () => t.run(this, c, data)
          });
        }
      }
      entries.sort((a, b) => a.seq - b.seq);
      for (const e of entries) {
        if (e.active())
          yield* e.run();
      }
    }
    *drawCard(p, count = true) {
      const P = this.players[p];
      const uid = P.deck.shift();
      if (uid === undefined)
        return null;
      const c = this.card(uid);
      this.place(c, { z: "hand", p });
      if (count)
        P.drawnThisTurn++;
      this.logPush(`J${p + 1} compra uma carta.`);
      if (count)
        yield* this.emit("draw", { player: p, card: c });
      if (c.loc?.z === "hand")
        yield* this.emit("enterHand", { player: p, card: c });
      return c;
    }
    *discard(c) {
      this.place(c, { z: "graveyard", p: c.owner });
      this.logPush(`J${c.owner + 1} descarta ${c.def.name}.`);
    }
    *returnToHand(c) {
      this.place(c, { z: "hand", p: c.owner });
      this.logPush(`${c.def.name} retorna pra mão de J${c.owner + 1}.`);
      if (c.loc?.z === "hand")
        yield* this.emit("enterHand", { player: c.owner, card: c });
    }
    *gainTreasure(p, n, opts = {}) {
      if (n <= 0)
        return;
      this.players[p].treasure += n;
      this.logPush(`J${p + 1} ${opts.steal ? "rouba" : "ganha"} ${n} tesouro(s) (total ${this.players[p].treasure}).`);
      if (this.players[p].treasure >= WIN_TREASURE)
        throw new GameOver(p);
      if (opts.steal)
        yield* this.emit("steal", { player: p, card: opts.by, amount: n, via: opts.via });
    }
    win(p) {
      this.logPush(`J${p + 1} vence por efeito de carta.`);
      throw new GameOver(p);
    }
    *flipUp(c) {
      if (!c.faceDown)

              yield* g2.gainTreasure(c.owner, 2);
            }
          });
        }
      }
    },
    {
      def: bandit("anaiti", "Anaiti", "Assassino", "Rápida", "Compre 2 cartas e descarte 1 delas.", "img20.jpg", "Evasiva"),
      power: {
        canUse: (g, c) => g.players[c.owner].deck.length > 0,
        *run(g, c) {
          const drawn = [];
          for (let i = 0;i < 2; i++) {
            const d = yield* g.drawCard(c.owner);
            if (d && d.loc?.z === "hand")
              drawn.push(d);
          }
          const t = yield* g.chooseCard(c.owner, "Anaiti: descarte 1 das cartas compradas.", drawn);
          if (t)
            yield* g.discard(t);
        }
      }
    },
    {
      def: bandit("barril", "Barril", "Ladrão", "Rápida", "Roube 3 tesouros se esta carta estiver na Zona do Tesouro.", "img33.jpg", "Fortão"),
      power: {
        canUse: (g, c) => g.pos(c)?.row === TREASURE_ROW,
        *run(g, c) {
          if (g.pos(c)?.row === TREASURE_ROW)
            yield* g.gainTreasure(c.owner, 3, { steal: true, by: c, via: "power" });
        }
      }
    },
    {
      def: bandit("sayyida", "Sayyida", "Ladrão", "Contínua", "Cada vez que esta carta roubar tesouros, mate 1 carta na mesma coluna que esta.", "img36.jpg"),
      power: {
        *run(g, c) {
          g.addWatcher({
            source: c,
            owner: c.owner,
            kind: "continua",
            event: "steal",
            cond: (_g, d) => d.card === c && d.player === c.owner && g.onBoard(c),
            *run(g2) {
              const col = g2.pos(c).col;
              const targets = killTargets(g2, c, (x) => g2.pos(x).col === col);
              const t = yield* g2.chooseCard(c.owner, "Sayyida: escolha a carta da coluna a matar.", targets);
              if (t)
                yield* g2.kill(t, c);
            }
          });
        }
      }
    },
    {
      def: bandit("ganzu", "Ganzu", "Ladrão", "Rápida", "Ganhe 2 tesouros para cada carta que você comprar neste turno.", "img39.jpg"),
      power: {
        canUse: (g, c) => g.players[c.owner].drawnThisTurn > 0,
        *run(g, c) {
          yield* g.gainTreasure(c.owner, 2 * g.players[c.owner].drawnThisTurn);
        }
      }
    },
    {
      def: bandit("rox", "Rox", "Ladrão", "Lenta", "Ganhe 1 tesouro para cada carta inimiga que virar pra cima no turno do oponente.", "img40.jpg"),
      power: {
        *run(g, c) {
          g.addWatcher({
            source: c,
            owner: c.owner,
            kind: "lenta",
            event: "flipUp",
            expireTurn: g.turn + 1,
            cond: (g2, d) => d.card.owner !== c.owner && g2.active === d.card.owner,
            *run(g2) {
              yield* g2.gainTreasure(c.owner, 1);
            }
          });
        }
      }
    },
    {
      def: bandit("grace", "Grace", "Ladrão", "Rápida", "Ganhe 1 tesouro para cada carta exausta.", "img106.jpg"),
      power: {
        *run(g, c) {
          yield* g.gainTreasure(c.owner, g.boardCards((x) => x.exhausted).length);
        }
      }
    },
    {
      def: bandit("ventus", "Ventus", "Espião", "Rápida", "Mova todas as cartas inimigas 1 posição para trás se a posição estiver vazia.", "img49.jpg", "Voador"),
      power: {
        *run(g, c) {
          const q = other(c.owner);
          const rows = q === 0 ? [0, 1, 2, 3, 4] : [4, 3, 2, 1, 0];
          let moved = 0;
          for (const r of rows)
            for (let col = 0;col < COLS; col++) {
              const x = g.cardAt(r, col);
              if (!x || x.owner !== q || x.faceDown)
                continue;
              const nr = r + backDir(q);
              if (nr < 0 || nr >= ROWS || g.cardAt(nr, col))
                continue;
              g.place(x, { z: "board", row: nr, col });
              moved++;
            }
          g.logPush(`Ventus empurra ${moved} carta(s) inimiga(s) para trás.`);
        }
      }
    },
    {
      def: bandit("malac", "Malac", "Espião", "Contínua", "Ganhe 1 ponto de ação cada vez que uma carta sua for bloqueada.", "img41.jpg"),
      power: {
        *run(g, c) {
          g.addWatcher({
            source: c,
            owner: c.owner,
            kind: "continua",
            event: "blocked",
            cond: (_g, d) => d.card.owner === c.owner,
            *run(g2) {
              g2.players[c.owner].pa += 1;
              g2.logPush("Malac concede 1 PA.");
            }
          });
        }
      }
    },
    {
      def: bandit("al-haddin", "Al Haddin", "Espião", "Rápida", "Olhe o seu Baralho e coloque 3 cartas no topo na ordem que desejar.", "img109.jpg"),
      power: {
        canUse: (g, c) => g.players[c.owner].deck.length > 0,
        *run(g, c) {
          const P = g.players[c.owner];
          const n = Math.min(3, P.deck.length);
          const ids = yield* g.choose(c.owner, `Al Haddin: escolha ${n} cartas, na ordem em que ficarão no topo (a primeira será a do topo).`, P.deck.map((u) => ({ id: String(u), label: g.card(u).def.name })), n, n, true);
          const chosen = ids.map(Number);
          P.deck = [...chosen, ...P.deck.filter((u) => !chosen.includes(u))];
          g.logPush("Al Haddin reorganiza o topo do baralho.");
        }
      }
    },
    {
      def: bandit("octavius", "Octavius", "Espião", "Lenta", "Exauste todas as cartas inimigas que virarem pra cima no turno do oponente.", "img107.jpg", "Invulnerável"),
      power: {
        *run(g, c) {
          g.addWatcher({
            source: c,
            owner: c.owner,
            kind: "lenta",
            event: "flipUp",
            expireTurn: g.turn + 1,
            cond: (g2, d) => d.card.owner !== c.owner && g2.active === d.card.owner,
            *run(g2, d) {
              d.card.exhausted = true;
              d.card.noPrepare = true;
              g2.logPush(`${d.card.def.name} é exaustada por Octavius.`);
            }
          });
        }
      }
    },
    {
      def: bandit("caelia", "Caelia", "Espião", "Rápida", "Troque de posição com outra carta sua e vire ambas pra baixo.", "img108.jpg", "Sorrateira"),
      power: {
        canUse: (g, c) => g.boardCards((x) => x !== c && x.owner === c.owner && !x.faceDown).length > 0,
        *run(g, c) {
          const partner = yield* g.chooseCard(c.owner, "Caelia: escolha a carta sua para trocar de posição.", g.boardCards((x) => x !== c && x.owner === c.owner && !x.faceDown));
          if (!partner)
            return;
          g.swapPositions(c, partner);
          g.logPush(`Caelia troca de posição com ${partner.def.name}.`);
          yield* g.flipDown(c);
          yield* g.flipDown(partner);
        }
      }
    },
    {
      def: bandit("barba-suja", "Barba Suja", "Maníaco", "Rápida", 'Crie 1 "Pirata".', "img69.jpg"),
      power: {
        canUse: (g, c) => g.createPositions(c.owner).length > 0,
        *run(g, c) {
          const spots = g.createPositions(c.owner);
          const [id] = yield* g.choose(c.owner, "Barba Suja: escolha a posição do Pirata.", spots.map((s) => ({ id: `${s.row},${s.col}`, label: zoneLabel(s.row, s.col) })));
          const [row, col] = id.split(",").map(Number);
          g.createCapanga(c.owner, "pirata", { z: "board", row, col });
        }
      }
    },
    {
      def: bandit("cesar", "César", "Maníaco", "Rápida", 'Crie 3 "Partes do Mapa" e coloque-as no fundo do seu Baralho. Não pode haver mais de 3 "Partes do Mapa" em jogo.', "img110.jpg"),
      power: {
        canUse: (g, c) => partsOutside(g, c.owner) === 0,
        *run(g, c) {
          for (let i = 0;i < 3; i++)
            g.createCapanga(c.owner, "partes-do-mapa", { z: "deck", p: c.owner });
        }
      }
    },
    {
      def: {
        id: "pirata",
        name: "Pirata",
        cls: "Capanga",
        text: "Esta carta tem a Habilidade do Ladrão.",
        img: "img84.jpg",
        abilityOf: "Ladrão"
      }
    },
    {
      def: {
        id: "partes-do-mapa",
        name: "Partes do Mapa",
        cls: "Capanga",
        img: "img116.jpg",
        text: 'Se houver 3 "Partes do Mapa" na sua mão, ganhe 5 tesouros e descarte-as.',
        alsoIn: ["hand"]
      },
      triggers: [
        {
          event: "enterHand",
          zones: ["hand"],
          cond: (g, card) => g.cardsInZone(card.owner, "hand").filter((x) => x.def.id === "partes-do-mapa").length >= 3,
          *run(g, card) {
            const parts = g.cardsInZone(card.owner, "hand").filter((x) => x.def.id === "partes-do-mapa");
            yield* g.gainTreasure(card.owner, 5);
            for (const p of parts)
              yield* g.discard(p);
          }
        }
      ]
    }
  ];
  var PIRATES = Object.fromEntries(entries.map((e) => [e.def.id, e]));
  // web/entry.js
  window.RD = { Game, PIRATES, PIRATE_DECK, botInput, zoneLabel };
})();
</script>
<script>
(function () {
  const { Game, PIRATES, PIRATE_DECK, botInput, zoneLabel } = RD;
  const ME = 0, FOE = 1;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ROW_LABELS = { 0: 'Sua Z1', 1: 'Sua Z2', 2: 'Tesouro', 3: 'Z2 do bot', 4: 'Z1 do bot' };
  const DISPLAY_ROWS = [4, 3, 2, 1, 0]; // bot no topo, você embaixo

  let g, sel = null, seed = 0, pickedIds = [], lastReq = null, toastTimer = null, botTimer = null;

  function newGame() {
    clearTimeout(botTimer);
    seed = Math.floor(Math.random() * 900000) + 100000;
    g = new Game({ decks: [PIRATE_DECK, PIRATE_DECK], library: PIRATES, seed });
    sel = null; pickedIds = []; lastReq = null;
    pump();
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  function submit(input) {
    const r = g.submit(ME, input);
    if (!r.ok) { toast(r.error); return false; }
    pump();
    return true;
  }

  function pump() {
    render();
    if (g.winner !== null) return;
    const w = g.waiting;
    if (w && w.player === FOE) {
      botTimer = setTimeout(() => {
        const inp = botInput(g, FOE);
        const r = g.submit(FOE, inp);
        if (!r.ok) console.error('bot', r.error);
        pump();
      }, 420);
    }
  }

  // ───────── desenho ─────────
  function cardMaps(v) {
    const m = new Map();
    v.board.forEach((row) => row.forEach((c) => c && m.set(c.uid, c)));
    v.hand.forEach((c) => m.set(c.uid, c));
    return m;
  }

  function cardHTML(c, opts = {}) {
    if (c.hidden) return `<div class="card foe down hiddenfoe">virada</div>`;
    const cls = ['card', c.owner === ME ? '' : 'foe', 'cls-' + c.cls, c.faceDown ? 'down' : '', c.exhausted ? 'exh' : ''].join(' ');
    const type = c.type ? `(${esc(c.type)})` : '';
    const tags = [];
    if (c.faceDown) tags.push('<span class="tag">virada</span>');
    if (c.blocked) tags.push('<span class="tag red">bloqueada</span>');
    else if (c.exhausted) tags.push('<span class="tag">exausta</span>');
    if (c.contActive) tags.push('<span class="tag gold">contínua</span>');
    const speed = c.speed && opts.full ? ` · ${esc(c.speed)}` : '';
    return `<div class="${cls}">
      <span class="badge">${esc(c.cls)}</span>
      <span class="nm">${esc(c.name)}</span>
      <span class="meta">${type}${speed}</span>
      ${opts.full ? `<span class="txt">${esc(c.text)}</span>` : ''}
      <span class="tags">${tags.join('')}</span></div>`;
  }

  function render() {
    const v = g.view(ME);
    const maps = cardMaps(v);
    const mine = g.waiting && g.waiting.player === ME && g.waiting.kind === 'action';
    const legal = mine ? g.legalActions() : [];

    if (sel !== null && !maps.has(sel)) sel = null;

    // destaques de destino para a carta escolhida
    const dest = new Map();
    if (mine && sel !== null) {
      for (const a of legal) {
        if (a.t === 'move' && a.card === sel) dest.set(`${a.row},${a.col}`, { a, attack: !!g.cardAt(a.row, a.col) });
        if (a.t === 'play' && a.card === sel) dest.set(`0,${a.col}`, { a, attack: false });
      }
    }

    // placar e status
    $('sc0').textContent = v.treasure[0];
    $('sc1').textContent = v.treasure[1];
    const phaseNames = { 0: 'Preparação', 1: 'Compra', 2: 'Preparação', 3: 'Assalto', 4: 'Final' };
    const pips = (n) => `<span class="pips" aria-label="${n} PA">${[0, 1, 2].map((i) => `<span class="pip ${i < n ? 'on' : ''}"></span>`).join('')}</span>`;
    let who;
    if (g.winner !== null) who = 'Fim de partida';
    else if (g.waiting.player === ME) who = g.waiting.kind === 'choice' ? 'Sua escolha' : 'Sua vez';
    else who = 'Bot jogando…';
    $('status').innerHTML = `<span class="who">${who}</span>
      <span>Turno ${v.turn} · Fase ${v.phase || '-'} ${esc(phaseNames[v.phase])}</span>
      <span>PA ${pips(v.pa[ME])}</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn primary" id="endturn" ${mine ? '' : 'disabled'}>Encerrar turno</button>`;
    $('endturn').onclick = () => { submit({ t: 'endTurn' }); };

    // tabuleiro
    let html = '';
    for (const r of DISPLAY_ROWS) {
      const cls = r === 2 ? 'row-t' : (r === 0 || r === 4) ? 'row-z1' : 'row-z2';
      html += `<div class="lab">${ROW_LABELS[r]}</div>`;
      for (let c = 0; c < 5; c++) {
        const cv = v.board[r][c];
        const d = dest.get(`${r},${c}`);
        const classes = ['cell', cls, d ? (d.attack ? 'attack' : 'target') : '', cv && cv.uid === sel ? 'sel' : '', cv ? '' : 'blank'].join(' ');
        const label = cv ? (cv.hidden ? 'carta virada do bot' : cv.name) : 'posição vazia';
        html += `<button class="${classes}" data-r="${r}" data-c="${c}" aria-label="${esc(zoneLabel(r, c))}: ${esc(label)}">${cv ? cardHTML(cv) : (r === 2 ? '<span class="chest">baú</span>' : '')}</button>`;
      }
    }
    $('board').innerHTML = html;
    // linhas de Tesouro vazias: o ::after cobre .blank
    $('board').querySelectorAll('.cell').forEach((el) => {
      el.onclick = () => onCell(+el.dataset.r, +el.dataset.c, dest, v);
    });

    // mão
    $('hand').innerHTML = v.hand.length
      ? v.hand.map((c) => `<button class="hcard ${c.uid === sel ? 'sel' : ''}" data-u="${c.uid}">${cardHTML(c, { full: true })}</button>`).join('')
      : '<span class="empty">Sem cartas na mão.</span>';
    $('hand').querySelectorAll('.hcard').forEach((el) => {
      el.onclick = () => { sel = +el.dataset.u; render(); };
    });

    renderDetail(v, maps, legal, mine);

    $('piles').innerHTML = `
      <div><small>Você</small><br>Baralho <b>${v.deckCount[0]}</b> · Extra <b>${v.extraCount[0]}</b><br>Cemitério: <b>${v.graveyard[0].map((c) => esc(c.name)).join(', ') || '—'}</b></div>
      <div><small>Bot</small><br>Baralho <b>${v.deckCount[1]}</b> · Extra <b>${v.extraCount[1]}</b> · Mão <b>${v.oppHandCount}</b><br>Cemitério: <b>${v.graveyard[1].map((c) => esc(c.name)).join(', ') || '—'}</b></div>`;

    const logEl = $('log');
    const stick = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 30;
    logEl.innerHTML = v.log.map((l) => `<div class="${l.text.startsWith('──') ? 'turn' : ''}">${esc(l.text.replace(/J1/g, 'Você').replace(/J2/g, 'Bot'))}</div>`).join('');
    if (stick) logEl.scrollTop = logEl.scrollHeight;
    $('seedinfo').textContent = `Partida nº ${seed} (informe este número se achar um erro).`;

    renderOverlay(v);
  }

  function onCell(r, c, dest, v) {
    const d = dest.get(`${r},${c}`);
    if (d) { submit(d.a); return; }
    const cv = v.board[r][c];
    sel = cv ? cv.uid : null;
    render();
  }

  function renderDetail(v, maps, legal, mine) {
    const el = $('detail');
    if (sel === null) {
      el.innerHTML = `<h3>Escolha uma carta</h3><p class="hint">Clique numa carta da mão para jogá-la (entra virada pra baixo na sua Z1), ou numa carta sua na mesa para mover, atacar ou usar poderes. As posições destacadas são as jogadas possíveis.</p>`;
      return;
    }
    const c = maps.get(sel);
    if (c.hidden) { el.innerHTML = `<h3>Carta virada do bot</h3><p class="hint">Só se revela quando virar pra cima.</p>`; return; }
    const full = g.card(sel);
    const inHand = full.loc.z === 'hand';
    const power = g.library[full.def.id].power;
    const acts = [];
    if (full.owner === ME && !inHand) {
      if (power) acts.push(['Usar poder', { t: 'power', card: sel }]);
      if (g.pos(full) && g.pos(full).row === 2) acts.push(['Roubar tesouro (1 PA)', { t: 'steal', card: sel }]);
      if (full.def.type === 'Evasiva') acts.push(['Virar pra baixo (Evasiva)', { t: 'type', card: sel, type: 'Evasiva' }]);
      if (full.def.type === 'Voador') acts.push(['Voltar pra mão (Voador)', { t: 'type', card: sel, type: 'Voador' }]);
    }
    const typeTxt = c.type ? ` (${esc(c.type)})` : '';
    el.innerHTML = `<h3>${esc(c.name)}</h3>
      <div class="sub">${esc(c.cls)}${typeTxt}${c.speed ? ' · ' + esc(c.speed) : ''}${c.owner === FOE ? ' · do bot' : ''}</div>
      <p>${esc(c.text)}</p>
      <div class="actions" id="acts"></div>
      ${inHand ? `<p class="hint">${full.def.type === 'Maldição' ? 'Maldição só sai da mão por descarte.' : 'Clique numa coluna destacada da sua Z1 para jogar (1 PA).'}</p>` : ''}`;
    const box = el.querySelector('#acts');
    acts.forEach(([label, a]) => {
      const err = g.checkAction(ME, a);
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = label; b.disabled = !!err;
      b.onclick = () => submit(a);
      box.appendChild(b);
      if (err) { const w = document.createElement('div'); w.className = 'why'; w.textContent = err; box.appendChild(w); }
    });
  }

  function renderOverlay(v) {
    const o = $('overlay');
    if (g.winner !== null) {
      const t = g.winner === 'draw' ? 'Empate' : g.winner === ME ? 'Você venceu!' : 'O bot venceu';
      o.innerHTML = `<div class="modal"><div class="box end"><h2>${t}</h2>
        <div>Tesouros: você ${v.treasure[0]} × ${v.treasure[1]} bot.</div>
        <button class="btn primary" id="again">Jogar de novo</button></div></div>`;
      $('again').onclick = newGame;
      return;
    }
    const w = g.waiting;
    if (w && w.player === ME && w.kind === 'choice') {
      if (lastReq !== w) { lastReq = w; pickedIds = []; }
      const single = w.min === 1 && w.max === 1 && !w.ordered;
      const hint = single ? '' : `Escolha de ${w.min} a ${w.max}${w.ordered ? ', na ordem desejada' : ''}.`;
      o.innerHTML = `<div class="modal"><div class="box"><h2>${esc(w.message.replace(/J1/g, 'Você').replace(/J2/g, 'O bot'))}</h2>
        ${hint ? `<div class="hint">${hint}</div>` : ''}
        <div class="opts">${w.options.map((op) => {
          const i = pickedIds.indexOf(op.id);
          return `<button class="opt ${i >= 0 ? 'picked' : ''}" data-id="${esc(op.id)}"><span class="n">${i >= 0 ? i + 1 : ''}</span>${esc(op.label)}</button>`;
        }).join('')}</div>
        ${single ? '' : `<button class="btn primary" id="confirm" ${pickedIds.length >= w.min && pickedIds.length <= w.max ? '' : 'disabled'}>Confirmar</button>`}
      </div></div>`;
      o.querySelectorAll('.opt').forEach((b) => {
        b.onclick = () => {
          const id = b.dataset.id;
          if (single) { o.innerHTML = ''; lastReq = null; submit({ t: 'choose', ids: [id] }); return; }
          const i = pickedIds.indexOf(id);
          if (i >= 0) pickedIds.splice(i, 1);
          else if (pickedIds.length < w.max) pickedIds.push(id);
          renderOverlay(v);
        };
      });
      const cf = o.querySelector('#confirm');
      if (cf) cf.onclick = () => { const ids = pickedIds.slice(); o.innerHTML = ''; lastReq = null; submit({ t: 'choose', ids }); };
      return;
    }
    o.innerHTML = '';
  }

  $('newgame').onclick = newGame;
  newGame();
})();
</script>
</body></html>
